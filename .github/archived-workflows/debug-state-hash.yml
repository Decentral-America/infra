name: Debug State Hash V2

on:
  workflow_dispatch:
    inputs:
      heights:
        description: 'Space-separated list of heights to fetch'
        required: true
        default: '3323 3324 3325'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testnet
    steps:
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0
      - name: Get LKE kubeconfig
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
        run: |
          CID=$(curl -s -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters" | \
            jq -r '.data[] | select(.label | test("testnet")) | .id' | head -1)
          RAW=$(curl -s -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters/${CID}/kubeconfig" | \
            jq -r '.kubeconfig')
          echo "$RAW" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Sanity check + raw fetch
        env:
          API_KEY: ${{ secrets.GEN_0_NODE_REST_API_KEY }}
          HEIGHTS: ${{ inputs.heights }}
        run: |
          set -uo pipefail
          kubectl port-forward pod/dcc-gen-0-0 -n dcc 16869:6869 >/dev/null 2>&1 &
          PF_PID=$!
          sleep 5
          echo "===== gen-0 height ====="
          curl -s "http://localhost:16869/blocks/height"
          echo
          echo "===== gen-0 block at 3325 (public, no auth) ====="
          curl -s "http://localhost:16869/blocks/at/3325" | head -c 800
          echo
          for h in $HEIGHTS; do
            echo "===== height $h raw (with status code) ====="
            curl -s -w "\nHTTP_STATUS:%{http_code}\n" -H "X-API-Key: $API_KEY" "http://localhost:16869/debug/stateHash/$h"
            echo
          done
          kill $PF_PID 2>/dev/null || true
