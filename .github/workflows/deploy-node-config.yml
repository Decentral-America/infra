name: Deploy Node Config to VPS
# Installs node-config/testnet/dcc.conf on the VPS (backup + diff printed) and restarts the main
# node on the image pinned in node-config/testnet/vps-image.env, through scripts/node-up.sh
# (fails closed: green only if healthy on the pinned digest with an advancing height).
on:
  workflow_call:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: main-node-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned VPS image digest
        id: image
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source node-config/testnet/vps-image.env
          [[ "${NODE_SCALA_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::vps-image.env must pin a digest"; exit 1; }
          echo "image=${NODE_SCALA_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH (pinned host key)
        env:
          DEPLOY_KEY: ${{ secrets.TESTNET_DEPLOY_SSH_KEY }}
          SSH_HOST:   ${{ secrets.TESTNET_DEPLOY_HOST }}
        run: ./scripts/ssh-setup.sh "$SSH_HOST"

      - name: Install dcc.conf and restart the node
        env:
          SSH_HOST:   ${{ secrets.TESTNET_DEPLOY_HOST }}
          SSH_USER:   ${{ secrets.TESTNET_DEPLOY_USER }}
          NODE_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          scp node-config/testnet/dcc.conf scripts/node-up.sh "${SSH_USER}@${SSH_HOST}:/tmp/"
          scp compose/node-scala.yml "${SSH_USER}@${SSH_HOST}:/opt/dcc/compose/node-scala.yml"
          # shellcheck disable=SC2029  # NODE_IMAGE is expanded locally on purpose
          ssh "${SSH_USER}@${SSH_HOST}" "set -euo pipefail
            CONF=/opt/dcc/config/node-testnet/dcc.conf
            sudo cp \"\$CONF\" \"\$CONF.prev\"
            sudo install -m 0644 -o root -g root /tmp/dcc.conf \"\$CONF\"
            rm -f /tmp/dcc.conf
            echo '=== dcc.conf diff (previous -> new) ==='
            sudo diff -u \"\$CONF.prev\" \"\$CONF\" || true
            bash /tmp/node-up.sh '${NODE_IMAGE}' testnet; rc=\$?; rm -f /tmp/node-up.sh; exit \$rc"
