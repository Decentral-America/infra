# ──────────────────────────────────────────────────────────────────────────────
# Reusable: Deploy Docker container via SSH
#
# Callers in other repos use:
#
#   jobs:
#     deploy:
#       uses: Decentral-America/infra/.github/workflows/deploy-container.yml@main
#       with:
#         network:     mainnet
#         image:       ghcr.io/decentral-america/scanner:abc1234
#         service:     scanner
#         compose_dir: /opt/dcc/compose
#       secrets: inherit
#
# The deploy job declares environment: ${{ inputs.network }}, so a mainnet or
# stagenet deploy requires approval from the release-approvers team before it
# runs (testnet is intentionally left ungated for iteration speed). Secrets
# themselves are org-level with a network prefix (TESTNET_/STAGENET_/MAINNET_
# DEPLOY_*), selected via ternary below — not environment-scoped secrets —
# because workflow_call cannot read the callee's environment secrets across
# repos. The environment key here is purely for the approval gate.
#
# Required org secrets, per network prefix (TESTNET_/STAGENET_/MAINNET_):
#   <PREFIX>_DEPLOY_HOST             — Linode server IP
#   <PREFIX>_DEPLOY_USER             — SSH user
#   <PREFIX>_DEPLOY_SSH_KEY          — Ed25519 private key (base64)
#
# Note: infra repo must be PUBLIC for cross-org reusable workflows to work
# on GitHub Free plan. No secrets are in the code — all sensitive values are
# in GitHub Secrets or on-server /opt/dcc/secrets/<network>.env files.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy Container

on:
  workflow_call:
    inputs:
      network:
        description: 'Target network (mainnet | stagenet | testnet)'
        required: true
        type: string
      image:
        description: 'Full image reference to pull (e.g. ghcr.io/decentral-america/scanner:abc1234)'
        required: true
        type: string
      service:
        description: 'Docker Compose service name to restart'
        required: true
        type: string
      compose_dir:
        description: 'Absolute path to docker-compose files on the server'
        required: false
        type: string
        default: '/opt/dcc/compose'
      wait_timeout:
        description: 'Seconds to wait for container to become healthy (docker compose up --wait-timeout). Increase for JVM services that have long startup: node-scala needs 180+.'
        required: false
        type: number
        default: 120
    secrets:
      GHCR_TOKEN:
        required: false
        description: 'Unused (all GHCR packages are public); kept so existing callers that pass it do not break.'
      # Org-level deploy secrets, selected per network below. Every caller passes
      # `secrets: inherit`; declaring them (optional) documents the contract and lets
      # actionlint type-check the expressions that read them.
      TESTNET_DEPLOY_HOST:     { required: false }
      TESTNET_DEPLOY_USER:     { required: false }
      TESTNET_DEPLOY_SSH_KEY:  { required: false }
      STAGENET_DEPLOY_HOST:    { required: false }
      STAGENET_DEPLOY_USER:    { required: false }
      STAGENET_DEPLOY_SSH_KEY: { required: false }
      MAINNET_DEPLOY_HOST:     { required: false }
      MAINNET_DEPLOY_USER:     { required: false }
      MAINNET_DEPLOY_SSH_KEY:  { required: false }

permissions:
  contents: read

# Prevent parallel deploys of the same service+network from racing.
# cancel-in-progress: false is critical — never cancel an in-flight deploy.
concurrency:
  group: deploy-${{ inputs.service }}-${{ inputs.network }}
  cancel-in-progress: false

jobs:
  # ── Container security scan ─────────────────────────────────────────────────
  # Trivy scans the image for HIGH/CRITICAL CVEs before it is deployed.
  # A clean scan is a hard gate: the deploy job only runs if this passes.
  # This catches vulnerabilities introduced between CI build and production deploy,
  # ensuring no image with known critical flaws reaches the live environment.
  scan:
    name: Trivy scan ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write  # upload SARIF to GitHub Security tab

    steps:
      - name: Refuse the main node (it has its own deploy path)
        if: inputs.service == 'node-scala'
        run: |
          echo "::error::deploy-container refuses node-scala: the main node is deployed only by infra update-node-image.yml (digest from node-config/<network>/vps-image.env via scripts/node-up.sh)."
          exit 1

      - name: Checkout infra repository
        # Required to make .trivyignore available in the working directory.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Decentral-America/infra
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy SARIF report (informational)
        # Same image and ignore list as the gate below, written as SARIF for the Security tab.
        # exit-code 0: the table scan that follows is the gate.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref:      '${{ inputs.image }}'
          format:         'sarif'
          output:         'trivy-results.sarif'
          severity:       'HIGH,CRITICAL'
          exit-code:      '0'
          ignore-unfixed: true
          scanners:       'vuln'
          version:        'v0.76.1'
          trivyignores:   '.trivyignore'

      - name: Run Trivy vulnerability scan
        # Hard gate — exits 1 on any unfixed HIGH/CRITICAL CVE not in .trivyignore.
        # Known accepted CVEs (with documented justification) are in infra/.trivyignore.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref:      '${{ inputs.image }}'
          format:         'table'
          severity:       'HIGH,CRITICAL'
          # Exit 1 if any HIGH or CRITICAL vuln found — hard gate for all networks.
          exit-code:      '1'
          ignore-unfixed:              true
          scanners:                    'vuln'
          version:                     'v0.76.1'
          # CVEs in OS packages pending Debian 12 backport — not exploitable via
          # our attack surface. See .trivyignore at root of this repo for details.
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        # continue-on-error: SARIF upload is informational only — GitHub Code
        # Scanning rejects uploads from non-default branches ("commit not found").
        # Scan results still appear in annotations. Never block the deploy gate.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ inputs.service }}

  deploy:
    name: Deploy ${{ inputs.service }} → ${{ inputs.network }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: scan
    # Gates mainnet/stagenet deploys behind release-approvers; testnet has no
    # required reviewers configured (see the header comment above).
    environment: ${{ inputs.network }}
    # DEPLOY_* secrets are org-level with network prefix (TESTNET_/STAGENET_/MAINNET_).
    # Cross-repo workflow_call cannot access callee environment secrets, so we use
    # org-level secrets accessible to all repos without duplication.

    steps:
      - name: Checkout infra repository
        # Checks out THIS (infra) repo so we can upload the latest compose file.
        # This ensures the compose file on the server is always in sync with the
        # version in git — no manual copying required.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Explicit repo required: when called via workflow_call from another repo,
          # actions/checkout defaults to the CALLER's repo, not infra's.
          repository: Decentral-America/infra
          persist-credentials: false

      - name: Set up SSH credentials (pinned host key)
        # scripts/ssh-setup.sh writes the deploy key, the PINNED host key from infra's
        # ssh/known_hosts and an ssh config with StrictHostKeyChecking yes. The old trust-on-first-use scan
        # trusted whatever key the host presented on every run; a host with no pin is refused.
        env:
          DEPLOY_HOST: ${{ inputs.network == 'testnet' && secrets.TESTNET_DEPLOY_HOST || inputs.network == 'stagenet' && secrets.STAGENET_DEPLOY_HOST || secrets.MAINNET_DEPLOY_HOST }}
          DEPLOY_KEY:  ${{ inputs.network == 'testnet' && secrets.TESTNET_DEPLOY_SSH_KEY || inputs.network == 'stagenet' && secrets.STAGENET_DEPLOY_SSH_KEY || secrets.MAINNET_DEPLOY_SSH_KEY }}
        run: ./scripts/ssh-setup.sh "$DEPLOY_HOST"

      - name: Upload compose file to server
        # Uploads compose/<service>.yml to $compose_dir/ (filename only, no subdirectory prefix).
        env:
          DEPLOY_HOST: ${{ inputs.network == 'testnet' && secrets.TESTNET_DEPLOY_HOST || inputs.network == 'stagenet' && secrets.STAGENET_DEPLOY_HOST || secrets.MAINNET_DEPLOY_HOST }}
          DEPLOY_USER: ${{ inputs.network == 'testnet' && secrets.TESTNET_DEPLOY_USER || inputs.network == 'stagenet' && secrets.STAGENET_DEPLOY_USER || secrets.MAINNET_DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key \
            "compose/${{ inputs.service }}.yml" \
            "$DEPLOY_USER@$DEPLOY_HOST:${{ inputs.compose_dir }}/"

      - name: Pull image, deploy, and auto-rollback on failure
        env:
          DEPLOY_HOST:       ${{ inputs.network == 'testnet' && secrets.TESTNET_DEPLOY_HOST || inputs.network == 'stagenet' && secrets.STAGENET_DEPLOY_HOST || secrets.MAINNET_DEPLOY_HOST }}
          DEPLOY_USER:       ${{ inputs.network == 'testnet' && secrets.TESTNET_DEPLOY_USER || inputs.network == 'stagenet' && secrets.STAGENET_DEPLOY_USER || secrets.MAINNET_DEPLOY_USER }}
          INPUT_IMAGE:       ${{ inputs.image }}
          INPUT_NETWORK:     ${{ inputs.network }}
          INPUT_SERVICE:     ${{ inputs.service }}
          INPUT_COMPOSE_DIR: ${{ inputs.compose_dir }}
          INPUT_WAIT_TIMEOUT: ${{ inputs.wait_timeout }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2087  # the heredoc is expanded locally on purpose (inputs -> remote vars)
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s << REMOTE
          set -euo pipefail
          export IMAGE_TAG="${INPUT_IMAGE}"
          export NETWORK="${INPUT_NETWORK}"
          SERVICE="${INPUT_SERVICE}"
          COMPOSE_DIR="${INPUT_COMPOSE_DIR}"
          INPUT_WAIT_TIMEOUT="${INPUT_WAIT_TIMEOUT}"

          # ── Capture previous image for rollback ────────────────────────
          # docker inspect returns the image digest/tag currently running.
          # If the container doesn't exist yet (first deploy), PREV_IMAGE
          # will be empty and the rollback block is a no-op.
          PREV_IMAGE=\$(docker inspect --format '{{.Config.Image}}' "\${SERVICE}-\${NETWORK}" 2>/dev/null || echo "")
          echo "Previous image: \${PREV_IMAGE:-<none — first deploy>}"

          # ── Clean up project-label mismatch (one-time migration) ──────────
          # Containers created before --project-name was introduced carry the
          # directory-based label (e.g. "compose"), and containers created by
          # plain `docker run` (deploy-node-config.yml's restart path) carry
          # NO compose label at all. In both cases docker compose up with our
          # --project-name sees no matching container and tries to CREATE one
          # — but the name is taken → conflict. Remove any existing same-name
          # container whose project label isn't ours (including the empty
          # unlabeled case) so docker compose can recreate it cleanly.
          # PREV_IMAGE (captured above) doubles as the existence check so a
          # first deploy with no container at all skips this cleanly.
          EXISTING_PROJECT=\$(docker inspect \
            --format '{{index .Config.Labels "com.docker.compose.project"}}' \
            "\${SERVICE}-\${NETWORK}" 2>/dev/null || true)
          EXPECTED_PROJECT="\${SERVICE}-\${NETWORK}"
          if [[ -n "\$PREV_IMAGE" && "\$EXISTING_PROJECT" != "\$EXPECTED_PROJECT" ]]; then
            echo "Removing \${SERVICE}-\${NETWORK} (project '\${EXISTING_PROJECT:-<none/docker run>}' ≠ '\$EXPECTED_PROJECT')..."
            docker rm -f "\${SERVICE}-\${NETWORK}"
          fi

          echo "Pulling \$IMAGE_TAG"
          docker pull "\$IMAGE_TAG"

          # Run by immutable digest, not the mutable tag (2026-10-18 audit): resolve the tag
          # just pulled to this repository's digest. Rollback then also targets a digest.
          if [[ "\$IMAGE_TAG" != *@sha256:* ]]; then
            REPO="\${IMAGE_TAG%:*}"
            DIGEST_REF=\$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "\$IMAGE_TAG" | grep "^\${REPO}@sha256:" | head -1)
            [[ -n "\$DIGEST_REF" ]] || { echo "::error::no \${REPO} repo digest for \$IMAGE_TAG"; exit 1; }
            export IMAGE_TAG="\$DIGEST_REF"
          fi
          echo "Deploying by digest: \$IMAGE_TAG"

          echo "Deploying \$SERVICE on \$NETWORK..."
          cd "\$COMPOSE_DIR"

          # docker compose up --wait blocks until every service in <service>.yml is running/healthy
          # (respects healthchecks). All services of the file come up, so companion services that
          # share the image (data-service's pairs-daemon) move to the new image together.
          # --project-name isolates this file's project so other services in the same directory
          # (e.g. caddy) are not treated as orphans. Never use --remove-orphans here.
          if ! docker compose \
            --project-name "\${SERVICE}-\${NETWORK}" \
            --file "\${SERVICE}.yml" up \
            --detach \
            --wait \
            --wait-timeout "\$INPUT_WAIT_TIMEOUT"; then

            echo "::error::Health check failed for \$SERVICE on \$NETWORK."

            # ── Diagnostics before any rollback replaces the failing container ──
            # State and the log tail of every container in this compose project (companions such
            # as the pairs daemon included). Workflow logs of this public repo are world-readable,
            # so secret-looking key=value pairs are masked before printing.
            echo "::group::Diagnostics for \${SERVICE}-\${NETWORK}"
            docker compose --project-name "\${SERVICE}-\${NETWORK}" --file "\${SERVICE}.yml" ps --all || true
            for c in \$(docker compose --project-name "\${SERVICE}-\${NETWORK}" --file "\${SERVICE}.yml" ps --all --format '{{.Name}}' 2>/dev/null || true); do
              echo "--- \$c"
              docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}} started={{.State.StartedAt}}' "\$c" || true
              docker logs --tail 80 "\$c" 2>&1 \
                | sed -E 's/((pass(word)?|secret|token|api[_-]?key|seed|authorization)[A-Za-z0-9_]*[=:" ]+)[^ ",}]+/\1***/Ig' || true
            done
            echo "::endgroup::"

            # ── Auto-rollback to the previous image ───────────────────────
            if [[ -n "\$PREV_IMAGE" ]]; then
              echo "Rolling back to previous image: \$PREV_IMAGE"
              export IMAGE_TAG="\$PREV_IMAGE"
              docker compose \
                --project-name "\${SERVICE}-\${NETWORK}" \
                --file "\${SERVICE}.yml" up \
                --detach \
                --wait \
                --wait-timeout "\$INPUT_WAIT_TIMEOUT" \
                && echo "Rollback successful: \$PREV_IMAGE is running." \
                || echo "::error::Rollback also failed — manual intervention required."
            else
              echo "No previous image to roll back to (first deploy). Manual intervention required."
            fi

            exit 1
          fi

          # Prune dangling images to reclaim disk space (keeps referenced images)
          docker image prune -f

          echo "Deploy complete: \$IMAGE_TAG → \$NETWORK"
          REMOTE
