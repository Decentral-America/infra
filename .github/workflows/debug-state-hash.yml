# ──────────────────────────────────────────────────────────────────────────────
# Debug State Hash — on-demand fetch of the decomposed /debug/stateHash/{height}
# breakdown (per-section hashes: dccBalance, assetBalance, dataEntry,
# accountScript, assetScript, leaseBalance, leaseStatus, sponsorship, alias,
# nextCommittedGenerators, committedGeneratorBalances) from a live testnet
# generator node. Read-only GET, safe to run anytime.
#
# Built to root-cause the still-open height-3325 InvalidStateHash divergence:
# comparing canonical per-section hashes (this workflow) against a local
# fresh-genesis replay's own per-section hashes at the same height pinpoints
# exactly which section diverges, instead of guessing at whole code paths.
# ──────────────────────────────────────────────────────────────────────────────
name: Debug State Hash

on:
  workflow_dispatch:
    inputs:
      heights:
        description: 'Space-separated list of heights to fetch (e.g. "3323 3324 3325")'
        required: true
        default: '3323 3324 3325'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testnet
    steps:
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0

      - name: Get LKE kubeconfig
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
        run: |
          CID=$(curl -s -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters" | \
            jq -r '.data[] | select(.label | test("testnet")) | .id' | head -1)
          RAW=$(curl -s -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters/${CID}/kubeconfig" | \
            jq -r '.kubeconfig')
          echo "$RAW" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Fetch decomposed stateHash per height from gen-0
        env:
          API_KEY: ${{ secrets.GEN_0_NODE_REST_API_KEY }}
          HEIGHTS: ${{ inputs.heights }}
        run: |
          set -euo pipefail
          kubectl port-forward pod/dcc-gen-0-0 -n dcc 16869:6869 >/dev/null 2>&1 &
          PF_PID=$!
          sleep 5
          for h in $HEIGHTS; do
            echo "===== height $h ====="
            curl -s -H "X-API-Key: $API_KEY" "http://localhost:16869/debug/stateHash/$h" | python3 -m json.tool || echo "(request failed for height $h)"
            echo
          done
          kill $PF_PID 2>/dev/null || true
