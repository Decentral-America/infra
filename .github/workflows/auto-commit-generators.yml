name: Auto-Commit Generators (T2 HotStuff)
# Commits all 3 generators to the next generation period automatically.
# Generation periods are 100 blocks (~50 min). Two staggered 10-min crons
# combine to fire every 5 min (12 attempts/hour) — GitHub cron can miss
# individual fires; this redundancy means a single missed fire can't stall T2.
# 2026-08-31: confirmed live that even 2 staggered crons both went dark for
# 3+ hours during a single heavy-CI-load day on this repo (independently
# corroborated by peer-watchdog.yml, an unrelated */5 cron, also going dark
# 5.5 hours in the same window) -- GitHub's `schedule` trigger is genuinely
# best-effort and gives no delivery guarantee under load, not something more
# cron entries alone can fix. Added `push` on main as a second, STRUCTURALLY
# INDEPENDENT trigger path (tied to the push webhook, not the schedule
# dispatcher). Safe to over-trigger: idempotent, "already committed" is the
# normal no-op outcome.
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 min (primary — high-frequency to survive cron gaps)
    - cron: '5,15,25,35,45,55 * * * *'  # at :05/:15/:25/:35/:45/:55 (fills any 10-min gaps)
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
permissions:
  contents: read
jobs:
  commit:
    runs-on: ubuntu-latest
    # Worst case: gen-0, gen-1, and val-0 each exhaust their 15x20s retry
    # window (~5 min each) = ~15 min just for retries, plus kubectl/SSH
    # setup and the finality report. 15 min was fine for the old single-shot
    # attempts but is too tight now.
    timeout-minutes: 25
    environment: testnet
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0

      - name: Get LKE kubeconfig
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
        run: |
          CLUSTER_ID=$(curl -s -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters" | \
            jq -r '.data[] | select(.label | test("testnet")) | .id' | head -1)
          RAW=$(curl -s -H "Authorization: Bearer $LINODE_TOKEN" \
            "https://api.linode.com/v4/lke/clusters/${CLUSTER_ID}/kubeconfig" | \
            jq -r '.kubeconfig')
          echo "$RAW" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Commit main node generator
        env:
          SSH_KEY:      ${{ secrets.TESTNET_DEPLOY_SSH_KEY }}
          SSH_HOST:     ${{ secrets.TESTNET_DEPLOY_HOST }}
          SSH_USER:     ${{ secrets.TESTNET_DEPLOY_USER }}
          MAIN_API_KEY: ${{ secrets.MAIN_NODE_REST_API_KEY }}
        run: |
          set -euo pipefail
          echo "$SSH_KEY" > /tmp/id_rsa && chmod 600 /tmp/id_rsa
          # Write key to temp file to avoid SSH quoting issues with Base64 special chars
          echo "${MAIN_API_KEY}" > /tmp/.main_key
          scp -i /tmp/id_rsa -o StrictHostKeyChecking=no /tmp/.main_key "${SSH_USER}@${SSH_HOST}:/tmp/.main_key" 2>/dev/null
          rm -f /tmp/.main_key
          ssh -i /tmp/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "${SSH_USER}@${SSH_HOST}" \
            'set -euo pipefail
             API_KEY=$(cat /tmp/.main_key 2>/dev/null | tr -d "\n")
             rm -f /tmp/.main_key
             ADDR="31RPEKcz71a3hdxt8z7qLhTpRMuRV2kUyr6"
             SIGNED=$(curl -s -X POST http://localhost:6869/transactions/sign \
               -H "X-API-Key: $API_KEY" -H "Content-Type: application/json" \
               -d "{\"type\":19,\"sender\":\"$ADDR\"}")
             if echo "$SIGNED" | grep -q "\"id\""; then
               RESULT=$(curl -s -X POST http://localhost:6869/transactions/broadcast \
                 -H "Content-Type: application/json" -d "$SIGNED")
               if echo "$RESULT" | grep -q "\"id\""; then
                 TXID=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"id\"])")
                 echo "Main: broadcast OK, id=$TXID"
               elif echo "$RESULT" | grep -qi "is already committed"; then
                 echo "Main: already committed (no-op)"
               else
                 echo "Main: broadcast FAILED: $(echo $RESULT | head -c 300)"
                 exit 1
               fi
             else
               echo "Main: sign FAILED: $(echo $SIGNED | head -c 300)"
               exit 1
             fi'
          rm -f /tmp/id_rsa

      - name: Commit gen-0 generator
        env:
          API_KEY: ${{ secrets.GEN_0_NODE_REST_API_KEY }}
        run: |
          set -euo pipefail
          ADDR="31PmKNdHAU5sZbtg8TrzKh8WfE7E8xBc9WD"
          kubectl port-forward pod/dcc-gen-0-0 -n dcc 16869:6869 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 5
          SIGNED=$(curl -s -X POST http://localhost:16869/transactions/sign \
            -H "X-API-Key: $API_KEY" -H "Content-Type: application/json" \
            -d "{\"type\":19,\"sender\":\"$ADDR\"}")
          if echo "$SIGNED" | grep -q '"id"'; then
            # gen-0's connection to the main node stays probabilistic even
            # with the HandshakeHandler stale-dedup fix live (2026-07-07
            # incident) -- a single-shot attempt misses often enough that
            # this cron (fires every 5 min) was relying purely on
            # volume-of-attempts across a whole 100-block generation period
            # to eventually land one (confirmed live: 4/4 consecutive
            # single-shot cron fires failed on 2026-07-07 while the chain
            # kept progressing regardless). A short retry here makes each
            # individual fire much more likely to succeed on its own.
            #
            # break ONLY on: (a) success ("id" in response) or (b) the
            # specific already-committed error. Retry on "not enough
            # connections" or a curl network failure (empty RESULT). Any
            # OTHER error is unexpected -- fail loudly instead of silently
            # swallowing it.
            for attempt in $(seq 1 15); do
              set +e
              RESULT=$(curl -s -X POST http://localhost:16869/transactions/broadcast \
                -H "Content-Type: application/json" -d "$SIGNED")
              CURL_RC=$?
              set -e
              if [ "$CURL_RC" -ne 0 ] || [ -z "$RESULT" ]; then
                echo "Gen-0: curl network error (rc=$CURL_RC) on attempt ${attempt}/15, retrying..."
              elif echo "$RESULT" | grep -q '"id"'; then
                break
              elif echo "$RESULT" | grep -qi "is already committed"; then
                break
              elif echo "$RESULT" | grep -q "not enough connections"; then
                : # retry
              else
                echo "Gen-0: broadcast FAILED (unexpected error): $(echo $RESULT | head -c 300)"
                exit 1
              fi
              [ "$attempt" -lt 15 ] && sleep 20
            done
            if echo "$RESULT" | grep -q '"id"'; then
              TXID=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"id\"])")
              echo "Gen-0: broadcast OK, id=$TXID (attempt ${attempt}/15)"
              echo "GEN0_TXID=$TXID" >> "$GITHUB_ENV"
            elif echo "$RESULT" | grep -qi "is already committed"; then
              echo "Gen-0: already committed (no-op, attempt ${attempt}/15)"
            else
              echo "Gen-0: exhausted retries without success: $(echo $RESULT | head -c 300)"
              exit 1
            fi
          else
            echo "Gen-0: sign FAILED: $(echo $SIGNED | head -c 300)"
            exit 1
          fi

      - name: Commit gen-1 generator
        env:
          API_KEY: ${{ secrets.GEN_1_NODE_REST_API_KEY }}
        run: |
          set -euo pipefail
          ADDR="31dLhqhGoGVhtkf5msWFmgZn1ErrVR6b9qV"
          kubectl port-forward pod/dcc-gen-1-0 -n dcc 16870:6870 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 5
          SIGNED=$(curl -s -X POST http://localhost:16870/transactions/sign \
            -H "X-API-Key: $API_KEY" -H "Content-Type: application/json" \
            -d "{\"type\":19,\"sender\":\"$ADDR\"}")
          if echo "$SIGNED" | grep -q '"id"'; then
            for attempt in $(seq 1 15); do
              set +e
              RESULT=$(curl -s -X POST http://localhost:16870/transactions/broadcast \
                -H "Content-Type: application/json" -d "$SIGNED")
              CURL_RC=$?
              set -e
              if [ "$CURL_RC" -ne 0 ] || [ -z "$RESULT" ]; then
                echo "Gen-1: curl network error (rc=$CURL_RC) on attempt ${attempt}/15, retrying..."
              elif echo "$RESULT" | grep -q '"id"'; then
                break
              elif echo "$RESULT" | grep -qi "is already committed"; then
                break
              elif echo "$RESULT" | grep -q "not enough connections"; then
                : # retry
              else
                echo "Gen-1: broadcast FAILED (unexpected error): $(echo $RESULT | head -c 300)"
                exit 1
              fi
              [ "$attempt" -lt 15 ] && sleep 20
            done
            if echo "$RESULT" | grep -q '"id"'; then
              TXID=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"id\"])")
              echo "Gen-1: broadcast OK, id=$TXID (attempt ${attempt}/15)"
              echo "GEN1_TXID=$TXID" >> "$GITHUB_ENV"
            elif echo "$RESULT" | grep -qi "is already committed"; then
              echo "Gen-1: already committed (no-op, attempt ${attempt}/15)"
            else
              echo "Gen-1: exhausted retries without success: $(echo $RESULT | head -c 300)"
              exit 1
            fi
          else
            echo "Gen-1: sign FAILED: $(echo $SIGNED | head -c 300)"
            exit 1
          fi

      - name: Commit val-0 generator (T2 upgrade)
        # val-0 has miner+hotstuff enabled (nodes.yaml). Address needs verification:
        # run check-val0-address.yml to get the actual wallet address, then update
        # ADDR below. Val-0 also needs DCC funding before it can generate blocks.
        # Port 6871 is val-0's REST API port.
        # continue-on-error removed: val-0 broadcast failures were being silently
        # swallowed, masking committee gaps (root cause of testnet committee-gap
        # incidents). gen-0/gen-1 never had this flag, so val-0 now matches them.
        env:
          API_KEY: ${{ secrets.VAL_0_NODE_REST_API_KEY }}
        run: |
          set -euo pipefail
          ADDR="31VMNVAvVh67dPZ41nMnYZvhoZFW7wwPrmq"
          kubectl port-forward pod/dcc-val-0-0 -n dcc 16871:6871 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 5
          SIGNED=$(curl -s -X POST http://localhost:16871/transactions/sign \
            -H "X-API-Key: $API_KEY" -H "Content-Type: application/json" \
            -d "{\"type\":19,\"sender\":\"$ADDR\"}")
          if echo "$SIGNED" | grep -q '"id"'; then
            for attempt in $(seq 1 15); do
              set +e
              RESULT=$(curl -s -X POST http://localhost:16871/transactions/broadcast \
                -H "Content-Type: application/json" -d "$SIGNED")
              CURL_RC=$?
              set -e
              if [ "$CURL_RC" -ne 0 ] || [ -z "$RESULT" ]; then
                echo "Val-0: curl network error (rc=$CURL_RC) on attempt ${attempt}/15, retrying..."
              elif echo "$RESULT" | grep -q '"id"'; then
                break
              elif echo "$RESULT" | grep -qi "is already committed"; then
                break
              elif echo "$RESULT" | grep -q "not enough connections"; then
                : # retry
              else
                echo "Val-0: broadcast FAILED (unexpected error): $(echo $RESULT | head -c 300)"
                exit 1
              fi
              [ "$attempt" -lt 15 ] && sleep 20
            done
            if echo "$RESULT" | grep -q '"id"'; then
              TXID=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"id\"])")
              echo "Val-0: broadcast OK, id=$TXID (attempt ${attempt}/15)"
              echo "VAL0_TXID=$TXID" >> "$GITHUB_ENV"
            elif echo "$RESULT" | grep -qi "is already committed"; then
              echo "Val-0: already committed (no-op, attempt ${attempt}/15)"
            else
              echo "Val-0: exhausted retries without success: $(echo $RESULT | head -c 300)"
              exit 1
            fi
          else
            echo "Val-0: sign FAILED: $(echo $SIGNED | head -c 300)"
            exit 1
          fi

      - name: Report finality
        env:
          SSH_KEY:  ${{ secrets.TESTNET_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.TESTNET_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.TESTNET_DEPLOY_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/id_rsa && chmod 600 /tmp/id_rsa
          ssh -i /tmp/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            "${SSH_USER}@${SSH_HOST}" \
            'H=$(curl -s http://localhost:6869/blocks/height | python3 -c "import json,sys; print(json.load(sys.stdin)[\"height\"])" 2>/dev/null)
             F=$(curl -s http://localhost:6869/blocks/height/finalized | python3 -c "import json,sys; print(json.load(sys.stdin)[\"height\"])" 2>/dev/null)
             echo "H: $H Finalized: $F Lag: $(( ${H:-0} - ${F:-0} ))"' 2>/dev/null
          rm -f /tmp/id_rsa

      # Real post-commit verification: previously nothing checked that a broadcast
      # commit actually resulted in a non-empty NEXT-period committee. This step
      # polls each freshly-broadcast tx for confirmation, then queries
      # GET /generators/at/{nextPeriodStart} on the main node's public HTTPS
      # endpoint and requires BOTH HTTP 200 AND a non-empty JSON array body.
      #
      # NOTE: out of range, this endpoint returns HTTP 404 with body "[]" --
      # a naive `jq length` on that body reads as "0 generators", which is WRONG
      # (it means "no data for that height", not "empty committee"). Checking
      # HTTP status is mandatory, not optional.
      - name: Verify next-period committee
        run: |
          set -euo pipefail
          NODE_URL="https://testnet-node.decentralchain.io"

          # Poll /transactions/info/<id> for each generator whose broadcast produced
          # a fresh tx id this run (GEN0_TXID/GEN1_TXID/VAL0_TXID env vars set above;
          # unset for a generator that no-op'd on "already committed" -- nothing new
          # to confirm in that case, which is fine).
          for label in GEN0 GEN1 VAL0; do
            eval "TXID=\${${label}_TXID:-}"
            if [ -z "$TXID" ]; then
              echo "$label: no fresh tx this run (already committed) — skipping confirmation poll"
              continue
            fi
            CONFIRMED=0
            for attempt in $(seq 1 15); do
              INFO=$(curl -s "${NODE_URL}/transactions/info/${TXID}" || true)
              if echo "$INFO" | grep -q '"height"'; then
                CONFIRMED=1
                echo "$label: tx $TXID confirmed (attempt ${attempt}/15)"
                break
              fi
              sleep 10
            done
            if [ "$CONFIRMED" -ne 1 ]; then
              echo "$label: tx $TXID did NOT confirm after 15 attempts (~2.5min)"
              exit 1
            fi
          done

          # Compute the next generation period's start height from the current
          # chain height (testnet generation-period-length=100, confirmed by this
          # workflow's own comments/timeout math above). This mirrors the node's
          # GenerationPeriod.next.start arithmetic for the steady-state (non-zero
          # period) case, which is what applies well past activation on this chain.
          HEIGHT_JSON=$(curl -s "${NODE_URL}/blocks/height")
          CURR_HEIGHT=$(echo "$HEIGHT_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['height'])")
          GEN_PERIOD_LEN=100
          NEXT_PERIOD_START=$(( ((CURR_HEIGHT / GEN_PERIOD_LEN) + 1) * GEN_PERIOD_LEN + 1 ))

          HTTP_CODE=$(curl -s -o /tmp/generators_body -w '%{http_code}' \
            "${NODE_URL}/generators/at/${NEXT_PERIOD_START}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Committee verification FAILED: GET /generators/at/${NEXT_PERIOD_START} returned HTTP ${HTTP_CODE} (expected 200). Body: $(cat /tmp/generators_body | head -c 300)"
            exit 1
          fi

          COUNT=$(jq 'length' /tmp/generators_body 2>/dev/null || echo 0)
          if [ "$COUNT" -le 0 ]; then
            echo "Committee verification FAILED: HTTP 200 but next-period committee at height ${NEXT_PERIOD_START} is EMPTY ($(cat /tmp/generators_body))"
            exit 1
          fi

          echo "Committee verification OK: next period (start ${NEXT_PERIOD_START}) has ${COUNT} committed generator(s)"
