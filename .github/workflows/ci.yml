name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TOFU_VERSION: '1.12.6'

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ── Node image parity (rule D6) ───────────────────────────────────────────
      # All four testnet nodes must pin the same node-scala digest: the VPS main
      # node (node-config/testnet/vps-image.env) and gen-0/gen-1/val-0
      # (clusters/testnet/apps/nodes.yaml).
      - name: Check node-scala digest parity (VPS vs LKE)
        run: ./scripts/check-digest-parity.sh

      # ── OpenTofu ──────────────────────────────────────────────────────────────
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu fmt check
        working-directory: terraform
        run: tofu fmt -check -recursive -diff

      - name: tofu init
        working-directory: terraform
        run: tofu init -backend=false

      - name: tofu validate
        working-directory: terraform
        run: tofu validate

      # ── Docker Compose validation ─────────────────────────────────────────────
      - name: Validate Docker Compose files
        env:
          IMAGE_TAG: 'ghcr.io/decentral-america/ci-validation:latest'
        run: |
          # Create dummy env/config files so compose config can parse references
          sudo mkdir -p /opt/dcc/secrets /opt/dcc/caddy
          sudo touch /opt/dcc/secrets/mainnet.env /opt/dcc/secrets/testnet.env /opt/dcc/secrets/stagenet.env /opt/dcc/secrets/grafana-testnet.env /opt/dcc/caddy/Caddyfile
          for f in compose/*.yml; do
            echo "Validating $f..."
            docker compose -f "$f" config --quiet
          done

      # ── Prometheus config + alert rule unit tests ─────────────────────────────
      # Same pinned image the VPS runs (compose/prometheus.yml). prometheus.yml
      # uses absolute /etc/prometheus paths, so it is checked from a copy laid
      # out like the container, with an empty file_sd target list.
      - name: promtool check config + test rules
        run: |
          set -euo pipefail
          IMG=$(grep -oE 'prom/prometheus:[^ ]+@sha256:[0-9a-f]+' compose/prometheus.yml)
          T=$(mktemp -d)
          mkdir -p "$T/file_sd"
          cp monitoring/prometheus.yml monitoring/alerts.yml "$T/"
          echo '[]' > "$T/file_sd/lke-chain.json"
          docker run --rm --entrypoint promtool -v "$T:/etc/prometheus:ro" "$IMG" \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/work:ro" -w /work "$IMG" \
            test rules tests/alerts_test.yml

      # ── Shell script linting ──────────────────────────────────────────────────
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          find . -name '*.sh' -type f | while read -r script; do
            echo "Checking $script..."
            shellcheck -x "$script"
          done

      # ── StackScript ASCII check ───────────────────────────────────────────────
      # Linode StackScript API rejects any non-ASCII character (bytes > 0x7F).
      # This check catches em dashes, Unicode arrows, box-drawing chars, etc.
      # before they reach the API and cause a cryptic position-N error.
      - name: Check bootstrap.sh is pure ASCII
        run: |
          if LC_ALL=C grep -Pn '[^\x00-\x7F]' terraform/scripts/bootstrap.sh; then
            echo "FAIL: bootstrap.sh contains non-ASCII characters (shown above)"
            echo "Linode StackScript API only accepts ASCII. Replace with -- or ->"
            exit 1
          fi
          echo "OK: bootstrap.sh is pure ASCII"
