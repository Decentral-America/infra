name: Update Main Node Image (NO DATA WIPE)
# The deploy path for the VPS main node: plugin jars from plugins/testnet/ plus the image pinned in
# node-config/testnet/vps-image.env (the single source of truth, rule D6), started by
# scripts/node-up.sh through compose/node-scala.yml. node-up fails closed: the run is green only if
# the node runs the pinned digest, is healthy, logs no class-linkage error and its height advances;
# otherwise it restores the previous image and the run is red.
# Staggered rollouts run this with --ref <pin-branch> (runbooks/staggered-node-rollout.md).
# Use restart-host-network.yml ONLY when a clean chain reset is needed.
on:
  workflow_call:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: main-node-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned VPS image digest
        id: image
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source node-config/testnet/vps-image.env
          [[ "${NODE_SCALA_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::vps-image.env must pin a digest"; exit 1; }
          echo "image=${NODE_SCALA_IMAGE}" >> "$GITHUB_OUTPUT"

      # Fail closed before touching the server: the node loads plugins AHEAD of its own classes, so a
      # plugin bundling a node class replaces it (2026-10-04: NoSuchMethodError in the miner and 5 fatal
      # shutdowns from stale protobuf classes in grpc.jar).
      - name: Check plugins do not shadow node image classes
        env:
          NODE_IMAGE: ${{ steps.image.outputs.image }}
        run: ./scripts/check-plugin-shadowing.sh "$NODE_IMAGE" plugins/testnet

      - name: Set up SSH (pinned host key)
        env:
          DEPLOY_KEY: ${{ secrets.TESTNET_DEPLOY_SSH_KEY }}
          SSH_HOST:   ${{ secrets.TESTNET_DEPLOY_HOST }}
        run: ./scripts/ssh-setup.sh "$SSH_HOST"

      - name: Ship plugins, compose file and node-up.sh
        env:
          SSH_HOST: ${{ secrets.TESTNET_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.TESTNET_DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp plugins/testnet/ext.jar plugins/testnet/grpc.jar scripts/node-up.sh "${SSH_USER}@${SSH_HOST}:/tmp/"
          scp compose/node-scala.yml "${SSH_USER}@${SSH_HOST}:/opt/dcc/compose/node-scala.yml"
          ssh "${SSH_USER}@${SSH_HOST}" 'set -euo pipefail
            sudo install -m 0644 -o root -g root /tmp/ext.jar /tmp/grpc.jar /opt/dcc/plugins/testnet/
            sudo rm -f /opt/dcc/plugins/testnet/ext.jar.disabled /opt/dcc/plugins/testnet/grpc.jar.disabled
            rm -f /tmp/ext.jar /tmp/grpc.jar
            sha256sum /opt/dcc/plugins/testnet/*.jar'
          sha256sum plugins/testnet/ext.jar plugins/testnet/grpc.jar

      - name: Deploy the pinned image (fails closed, rolls back on failure)
        env:
          SSH_HOST:   ${{ secrets.TESTNET_DEPLOY_HOST }}
          SSH_USER:   ${{ secrets.TESTNET_DEPLOY_USER }}
          NODE_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029  # NODE_IMAGE is expanded locally on purpose
          ssh "${SSH_USER}@${SSH_HOST}" "bash /tmp/node-up.sh '${NODE_IMAGE}' testnet; rc=\$?; rm -f /tmp/node-up.sh; exit \$rc"

# NOTE: Plugin JARs (plugins/testnet/ext.jar, grpc.jar) are committed to this repo, built from
# Ecosystem/matcher. AUD-009 (matcher plan) moves them to CI-built artifacts with provenance.
