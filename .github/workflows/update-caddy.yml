name: Update Caddy
# Renders the Caddyfile with scripts/render-caddyfile.sh: domains from terraform/testnet.tfvars,
# MAIN_NODE_REST_API_KEY from SOPS, the admin-e2e bypass key from the secret store. The output is
# validated with the exact caddy-ratelimit image pinned in compose/caddy.yml (stock Caddy lacks
# the rate_limit module). Then, with dry_run, prints a key-masked diff against the live file and
# stops; otherwise installs it root-owned 0600 (it embeds two keys) and reloads Caddy in place.
on:
  workflow_dispatch:
    inputs:
      network:
        required: true
        default: 'testnet'
        type: choice
        options: [testnet]
      dry_run:
        description: 'Only print a diff (keys masked) against the live Caddyfile; change nothing'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only testnet is selectable today (ungated by policy); wiring this now
    # means adding stagenet/mainnet to the choice list later is safe by default.
    environment: ${{ inputs.network }}

    steps:
      - name: Checkout infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up SSH (pinned host key)
        env:
          DEPLOY_KEY:  ${{ secrets.TESTNET_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.TESTNET_DEPLOY_HOST }}
        run: ./scripts/ssh-setup.sh "$DEPLOY_HOST"

      - name: Render, validate and diff the Caddyfile
        env:
          SOPS_AGE_KEY:   ${{ secrets.AGE_KEY_TESTNET }}
          NETWORK:        ${{ inputs.network }}
          E2E_BYPASS_KEY: ${{ secrets.E2E_RATE_LIMIT_BYPASS_KEY }}
          SELF_IP:        ${{ secrets.TESTNET_DEPLOY_HOST }}
          DEPLOY_HOST:    ${{ secrets.TESTNET_DEPLOY_HOST }}
          DEPLOY_USER:    ${{ secrets.TESTNET_DEPLOY_USER }}
        run: |
          set -euo pipefail
          SOPS_VERSION="v3.13.3"
          SOPS_SHA256="e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
          curl -fsSL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" -o /tmp/sops-bin
          echo "${SOPS_SHA256}  /tmp/sops-bin" | sha256sum --check --status
          install -m 755 /tmp/sops-bin /usr/local/bin/sops
          rm /tmp/sops-bin

          NODE_API_KEY=$(sops --decrypt "secrets/${NETWORK}.env" | grep '^MAIN_NODE_REST_API_KEY=' | cut -d= -f2- || true)
          echo "::add-mask::${NODE_API_KEY}"
          [[ -n "${NODE_API_KEY}" ]] || { echo "::error::MAIN_NODE_REST_API_KEY is not in secrets/${NETWORK}.env"; exit 1; }
          [[ -n "${E2E_BYPASS_KEY}" ]] || { echo "::error::secret E2E_RATE_LIMIT_BYPASS_KEY is empty"; exit 1; }
          export NODE_API_KEY E2E_BYPASS_KEY SELF_IP
          # The rendered file embeds both keys: keep every runner-local copy owner-only.
          umask 077
          bash scripts/render-caddyfile.sh terraform/testnet.tfvars > /tmp/Caddyfile
          echo "Caddyfile rendered ($(wc -l < /tmp/Caddyfile) lines)"

          IMG=$(grep -oE 'ghcr.io/decentral-america/caddy-ratelimit@sha256:[0-9a-f]{64}' compose/caddy.yml)
          docker run --rm -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro "$IMG" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          # Key-masked diff against the live file (always printed; the only output in dry_run).
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo cat /opt/dcc/caddy/Caddyfile' > /tmp/Caddyfile.live
          python3 - <<'PY'
          import os, re
          keys = {os.environ["NODE_API_KEY"]: "<NODE_API_KEY>", os.environ["E2E_BYPASS_KEY"]: "<E2E_BYPASS_KEY>"}
          for src in ("/tmp/Caddyfile", "/tmp/Caddyfile.live"):
              text = open(src).read()
              for k, v in keys.items():
                  text = text.replace(k, v)
              text = re.sub(r'(X-API-Key\s+")[^"]*(")', r'\1<MASKED>\2', text)
              open(src + ".masked", "w").write(text)
          PY
          rm -f /tmp/Caddyfile.live
          diff -u /tmp/Caddyfile.live.masked /tmp/Caddyfile.masked || true

      - name: Install Caddyfile + compose file and reload Caddy
        if: ${{ !inputs.dry_run }}
        env:
          DEPLOY_HOST: ${{ secrets.TESTNET_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TESTNET_DEPLOY_USER }}
          NETWORK:     ${{ inputs.network }}
        run: |
          set -euo pipefail
          # Stream the Caddyfile over stdin: it never lands in /tmp on the VPS. It is a single-file
          # bind mount into caddy-testnet, so it must be rewritten IN PLACE (same inode): `install`
          # unlinks and recreates the target, which would leave the container on the old file.
          # Fail-safe: stage to a 0600 temp, verify its sha256 against the runner's rendered file,
          # and only then overwrite the live file in place (`cat >` truncates + rewrites, same inode).
          # A failed or truncated transfer therefore never reaches the live Caddyfile.
          EXPECTED_SHA=$(sha256sum /tmp/Caddyfile | cut -d' ' -f1)
          read -r -d '' REMOTE_WRITE <<'SCRIPT' || true
          set -euo pipefail
          umask 077
          tmp=/opt/dcc/caddy/.Caddyfile.new
          trap 'rm -f "$tmp"' EXIT
          cat > "$tmp"
          actual=$(sha256sum "$tmp" | cut -d' ' -f1)
          [[ "$actual" == "$1" ]] || { echo "Caddyfile sha256 mismatch (got $actual)" >&2; exit 1; }
          cat "$tmp" > /opt/dcc/caddy/Caddyfile
          chown root:root /opt/dcc/caddy/Caddyfile
          chmod 600 /opt/dcc/caddy/Caddyfile
          rm -f "$tmp"
          SCRIPT
          # shellcheck disable=SC2029  # script + hash are expanded locally on purpose
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash -c $(printf '%q' "$REMOTE_WRITE") _ ${EXPECTED_SHA}" < /tmp/Caddyfile
          # compose/caddy.yml too: an image pin change must reach the server (it used to sync only
          # the Caddyfile, so `compose pull` kept resolving a stale on-disk file).
          scp compose/caddy.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/dcc/compose/caddy.yml"
          # shellcheck disable=SC2087  # NETWORK is expanded locally on purpose
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail
          # The Caddyfile (root:root 0600, embeds both keys) was already written in place above.
          # compose up -d recreates the container only when its own config (e.g. the image pin)
          # changed; the reload below applies Caddyfile-only changes without downtime.
          NETWORK="${NETWORK}" docker compose --project-name "caddy-${NETWORK}" -f /opt/dcc/compose/caddy.yml pull
          NETWORK="${NETWORK}" docker compose --project-name "caddy-${NETWORK}" -f /opt/dcc/compose/caddy.yml up -d
          docker exec "caddy-${NETWORK}" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          stat -c '%U:%G %a %n' /opt/dcc/caddy/Caddyfile
          REMOTE
