# ──────────────────────────────────────────────────────────────────────────────
# Push SOPS-encrypted secrets to a provisioned server via SSH.
#
# Called by provision.yml after tofu apply. Runs under the network's deploy
# environment (testnet / stagenet / mainnet) so DEPLOY_SSH_KEY and
# AGE_SECRET_KEY are scoped there — never in the provision environment.
#
# Required environment secrets (in the <network> deploy environment):
#   DEPLOY_SSH_KEY  — base64-encoded Ed25519 private key for the deploy user
#   AGE_SECRET_KEY  — age private key for SOPS decryption (per-network)
#
# Inputs:
#   network    — testnet | stagenet | mainnet
#   server_ip  — public IPv4 of the provisioned server
# ──────────────────────────────────────────────────────────────────────────────

name: Push Secrets via SSH

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network'
        required: true
        default: 'testnet'
        type: choice
        options: [testnet, stagenet, mainnet]
      server_ip:
        description: 'Server IP (from tofu output backend_ip)'
        required: true
        type: string
  workflow_call:
    inputs:
      network:
        type: string
        required: true
      server_ip:
        type: string
        required: true

permissions:
  contents: read

jobs:
  push:
    name: Push SOPS secrets (${{ inputs.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This environment holds DEPLOY_SSH_KEY and AGE_SECRET_KEY.
    # Keeping them here (not in the provision environment) limits the blast
    # radius: compromising the provision environment does not grant SSH access.
    environment: ${{ inputs.network }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate required secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          AGE_SECRET_KEY: ${{ secrets.AGE_SECRET_KEY }}
          NETWORK:        ${{ inputs.network }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${DEPLOY_SSH_KEY:-}" ] && MISSING="${MISSING} DEPLOY_SSH_KEY"
          [ -z "${AGE_SECRET_KEY:-}"  ] && MISSING="${MISSING} AGE_SECRET_KEY"
          if [ -n "${MISSING}" ]; then
            echo "::error::Missing secrets in the '${NETWORK}' GitHub environment:${MISSING}"
            echo "Go to: Settings → Environments → ${NETWORK} and add the listed secrets."
            echo "Alternatively, run scripts/push-secrets-local.sh directly from your machine."
            exit 1
          fi
          echo "[push-secrets] Required secrets present."

      - name: Push secrets via SSH (SOPS)
        env:
          SOPS_AGE_KEY:   ${{ secrets.AGE_SECRET_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          NETWORK:        ${{ inputs.network }}
          SERVER_IP:      ${{ inputs.server_ip }}
        run: |
          set -euo pipefail

          # ── Install sops (pinned release + verified SHA256) ─────────────────
          # v3.13.x bundles a post-quantum-capable age (confirmed for v3.13.1;
          # not re-verified for this v3.13.2 patch bump, but no age-related
          # changelog entry suggests otherwise) supporting hybrid
          # ML-KEM-768 + X25519 recipients (age1pq1... keys). Required for
          # the PQ age key upgrade from X25519-only keys.
          SOPS_VERSION="v3.13.3"
          SOPS_SHA256="e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
          curl -fsSL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" \
            -o /tmp/sops-bin
          echo "${SOPS_SHA256}  /tmp/sops-bin" | sha256sum --check --status \
            || { echo "[secrets-push] FATAL: sops binary SHA256 mismatch — aborting"; exit 1; }
          install -m 755 /tmp/sops-bin /usr/local/bin/sops
          rm /tmp/sops-bin

          # ── SSH key setup ───────────────────────────────────────────────────
          echo "${DEPLOY_SSH_KEY}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 deploy@${SERVER_IP}"

          # ── Wait for SSH (5 min) ────────────────────────────────────────────
          echo "[secrets-push] Waiting for SSH on ${SERVER_IP}..."
          for i in $(seq 1 30); do
            if $SSH "echo ready" 2>/dev/null; then echo "[secrets-push] SSH ready."; break; fi
            [ "${i}" -eq 30 ] && { echo "[secrets-push] FATAL: SSH timeout after 5 min"; exit 1; }
            sleep 10
          done

          # ── Wait for bootstrap-complete marker (10 min) ─────────────────────
          echo "[secrets-push] Waiting for bootstrap to finish..."
          for i in $(seq 1 60); do
            if $SSH "test -f /opt/dcc/.bootstrap-complete" 2>/dev/null; then
              echo "[secrets-push] Bootstrap complete."; break
            fi
            [ "${i}" -eq 60 ] && { echo "[secrets-push] FATAL: bootstrap timeout after 10 min"; exit 1; }
            sleep 10
          done

          # ── Decrypt SOPS — stays in runner memory only ──────────────────────
          echo "[secrets-push] Running SOPS decrypt..."
          sops --version
          echo "[secrets-push] AGE key present: $([ -n "${SOPS_AGE_KEY:-}" ] && echo YES || echo NO)"
          echo "[secrets-push] Secrets file exists: $([ -f "secrets/${NETWORK}.env" ] && echo YES || echo NO)"
          set +e
          SECRETS=$(sops --decrypt "secrets/${NETWORK}.env" 2>&1)
          SOPS_EXIT=$?
          set -e
          echo "[secrets-push] SOPS exit code: ${SOPS_EXIT}"
          if [ "${SOPS_EXIT}" -ne 0 ]; then
            echo "[secrets-push] FATAL: SOPS decryption failed — output:"
            echo "${SECRETS}"
            exit 1
          fi

          # grep exits 1 on no match — || true prevents pipefail from aborting on optional keys
          PG_PASS=$(        printf '%s' "${SECRETS}" | grep '^POSTGRES_PASSWORD='        | cut -d= -f2- || true)
          WALLET_SEED=$(    printf '%s' "${SECRETS}" | grep '^MAIN_NODE_WALLET_SEED='         | cut -d= -f2- || true)
          WALLET_PASS=$(    printf '%s' "${SECRETS}" | grep '^MAIN_NODE_WALLET_PASSWORD='     | cut -d= -f2- || true)
          MATCHER_HASH=$(   printf '%s' "${SECRETS}" | grep '^MATCHER_API_KEY_HASH='     | cut -d= -f2- || true)
          # Base64 of the matcher ACCOUNT seed (keccak256(blake2b256(int32 nonce 0 || utf8 mnemonic))), exactly
          # what account-storage.in-mem.seed-in-base-64 expects (matcher AccountStorage.load -> KeyPair(seed)).
          MATCHER_SEED_B64=$(printf '%s' "${SECRETS}" | grep '^MATCHER_SEED_BASE64='      | cut -d= -f2- || true)
          REDIS_PASS=$(     printf '%s' "${SECRETS}" | grep '^REDIS_PASSWORD='           | cut -d= -f2- || true)
          NODE_API_KEY=$(          printf '%s' "${SECRETS}" | grep '^MAIN_NODE_REST_API_KEY='                   | cut -d= -f2- || true)
          DEFAULT_MATCHER=$(       printf '%s' "${SECRETS}" | grep '^DEFAULT_MATCHER='                        | cut -d= -f2- || true)
          # data-service's DEFAULT_MATCHER is the matcher ADDRESS (it filters exchange txs by sender
          # address), while SOPS DEFAULT_MATCHER is the matcher PUBLIC KEY used to verify the matcher's
          # identity below. Writing the public key made data-service candles/pairs empty unless a
          # caller passed matcher= explicitly (2026-10-18 audit).
          DEFAULT_MATCHER_ADDRESS=$(printf '%s' "${SECRETS}" | grep '^DEFAULT_MATCHER_ADDRESS='               | cut -d= -f2- || true)
          ADMIN_OAUTH_CLIENT_ID=$( printf '%s' "${SECRETS}" | grep '^ADMIN_DASHBOARD_GITHUB_OAUTH_CLIENT_ID=' | cut -d= -f2- || true)
          ADMIN_OAUTH_CLIENT_SEC=$(printf '%s' "${SECRETS}" | grep '^ADMIN_DASHBOARD_GITHUB_OAUTH_CLIENT_SECRET=' | cut -d= -f2- || true)
          ADMIN_JWT_SECRET=$(      printf '%s' "${SECRETS}" | grep '^ADMIN_DASHBOARD_JWT_SECRET='             | cut -d= -f2- || true)
          ADMIN_DASHBOARD_GITHUB_PAT=$(      printf '%s' "${SECRETS}" | grep '^ADMIN_DASHBOARD_GITHUB_PAT='                       | cut -d= -f2- || true)
          GRAFANA_URL=$(           printf '%s' "${SECRETS}" | grep '^GRAFANA_URL='                            | cut -d= -f2- || true)
          SENTRY_AUTH_TOKEN=$(     printf '%s' "${SECRETS}" | grep '^SENTRY_AUTH_TOKEN='                      | cut -d= -f2- || true)
          FAUCET_SEED=$(           printf '%s' "${SECRETS}" | grep '^DCC_FAUCET_SEED='                        | cut -d= -f2- || true)
          CANARY_SEED=$(           printf '%s' "${SECRETS}" | grep '^DCC_CANARY_SEED='                        | cut -d= -f2- || true)
          GRAFANA_ADMIN_PASS=$(    printf '%s' "${SECRETS}" | grep '^GRAFANA_ADMIN_PASSWORD='                 | cut -d= -f2- || true)
          TREASURY_SEED=$(         printf '%s' "${SECRETS}" | grep '^TREASURY_SEED='                          | cut -d= -f2- || true)
          # The matcher's real key comes from SOPS only. The old fallback read DEFAULT_MATCHER back from the
          # live matcher API, which echoed whatever key the matcher was running -- including the empty-seed key
          # it ran on from 2026-07-01 to 2026-10-09 because MATCHER_SEED was never written to local.conf.
          if [[ -z "${DEFAULT_MATCHER_ADDRESS:-}" ]]; then
            echo "[secrets-push] FATAL: DEFAULT_MATCHER_ADDRESS (the matcher's address, for data-service) must be in secrets/${NETWORK}.env"
            exit 1
          fi
          if [[ -z "${MATCHER_SEED_B64:-}" || -z "${DEFAULT_MATCHER:-}" ]]; then
            echo "[secrets-push] FATAL: MATCHER_SEED_BASE64 and DEFAULT_MATCHER must both be in secrets/${NETWORK}.env;"
            echo "[secrets-push] refusing to write a matcher config without a real key (it would sign as KeyPair(empty))."
            exit 1
          fi
          echo "[secrets-push] Keys extracted: PG=${#PG_PASS} WALLET=${#WALLET_SEED} REDIS=${#REDIS_PASS} NODE_API=${#NODE_API_KEY} MATCHER=${#DEFAULT_MATCHER} GRAFANA_ADMIN=${#GRAFANA_ADMIN_PASS}"

          # ── 1. Append sensitive values to secrets file ──────────────────────
          {
            printf '# Sensitive values — injected via SSH push (SOPS), never via Linode UDF\n'
            printf 'PGPASSWORD=%s\n'           "${PG_PASS}"
            # BPS (blockchain-postgres-sync) uses envy::prefixed("POSTGRES__")
            # and cannot read standard PG* vars — mirror the password under that prefix.
            printf 'POSTGRES__PASSWORD=%s\n'   "${PG_PASS}"
            printf 'DCC_WALLET_SEED=%s\n'      "${WALLET_SEED}"
            printf 'DCC_WALLET_PASSWORD=%s\n'  "${WALLET_PASS}"
            # Redis — shared by websocket-api (REPO__PASSWORD) and BPS (BPS_REDIS_URL).
            # REDIS_PASSWORD must exist in secrets/${NETWORK}.env (SOPS-encrypted).
            if [[ -n "${REDIS_PASS:-}" ]]; then
              printf 'REDIS_PASSWORD=%s\n'     "${REDIS_PASS}"
              # websocket-api reads REPO__PASSWORD via envy::prefixed("REPO__")
              printf 'REPO__PASSWORD=%s\n'     "${REDIS_PASS}"
              # BPS reads its config with envy::prefixed("BPS_"), so the variable must be
              # BPS_REDIS_URL. Writing plain REDIS_URL left publishing disabled ("REDIS_URL not set")
              # and websocket-api never emitted a single update (2026-10-18 audit).
              printf 'BPS_REDIS_URL=redis://:%s@127.0.0.1:6379/\n' "${REDIS_PASS}"
            else
              printf '# WARNING: REDIS_PASSWORD not found in SOPS secrets — Redis publishing disabled.\n'
              printf '# Add REDIS_PASSWORD=<password> to secrets/%s.env and re-run push-secrets.\n' "${NETWORK}"
            fi
            # Node REST API key — used by Caddy to inject X-API-Key for protected endpoints
            # so the public blockchain explorer can display peer data.
            if [[ -n "${NODE_API_KEY:-}" ]]; then
              printf 'MAIN_NODE_REST_API_KEY=%s\n' "${NODE_API_KEY}"
            fi
            # Faucet — the scanner app's /api/faucet signs+broadcasts from this wallet seed.
            # Without it the faucet returns "Faucet not configured" (503). Must be in SOPS so a
            # re-provision restores it (previously drifted: set manually on-server only).
            if [[ -n "${FAUCET_SEED:-}" ]]; then
              printf 'DCC_FAUCET_SEED=%s\n'  "${FAUCET_SEED}"
            else
              printf '# WARNING: DCC_FAUCET_SEED not found in SOPS secrets — faucet will be disabled.\n'
            fi
            # Canary transactions — Tier 6 synthetic monitoring signs+broadcasts a real,
            # low-value transfer on a schedule using this dedicated seed. Kept in SOPS so a
            # re-provision restores it, same reasoning as DCC_FAUCET_SEED above.
            if [[ -n "${CANARY_SEED:-}" ]]; then
              printf 'DCC_CANARY_SEED=%s\n'  "${CANARY_SEED}"
            else
              printf '# WARNING: DCC_CANARY_SEED not found in SOPS secrets — Tier 6 canary monitoring will be disabled.\n'
            fi
            # data-service non-secret config — required by the service on startup.
            # data-service's DEFAULT_MATCHER is the matcher ADDRESS (see DEFAULT_MATCHER_ADDRESS above).
            printf 'DEFAULT_MATCHER=%s\n'                       "${DEFAULT_MATCHER_ADDRESS}"
            # RATE_PAIR_ACCEPTANCE_VOLUME_THRESHOLD must be a positive integer.
            printf 'RATE_PAIR_ACCEPTANCE_VOLUME_THRESHOLD=%s\n' "${RATE_PAIR_ACCEPTANCE_VOLUME_THRESHOLD:-1}"
            printf 'RATE_THRESHOLD_ASSET_ID=%s\n'               "${RATE_THRESHOLD_ASSET_ID:-DCC}"
            # Admin dashboard — OAuth, JWT, and operational integration keys
            if [[ -n "${ADMIN_OAUTH_CLIENT_ID:-}" ]]; then
              printf 'ADMIN_DASHBOARD_GITHUB_OAUTH_CLIENT_ID=%s\n'     "${ADMIN_OAUTH_CLIENT_ID}"
              printf 'ADMIN_DASHBOARD_GITHUB_OAUTH_CLIENT_SECRET=%s\n' "${ADMIN_OAUTH_CLIENT_SEC}"
              printf 'ADMIN_DASHBOARD_JWT_SECRET=%s\n'                 "${ADMIN_JWT_SECRET}"
            fi
            # GitHub PAT for CI/CD status page (Actions: Read on Decentral-America/*)
            if [[ -n "${ADMIN_DASHBOARD_GITHUB_PAT:-}" ]]; then
              printf 'ADMIN_DASHBOARD_GITHUB_PAT=%s\n' "${ADMIN_DASHBOARD_GITHUB_PAT}"
            fi
            # Grafana embed URL (non-secret, but stored in SOPS for consistency)
            if [[ -n "${GRAFANA_URL:-}" ]]; then
              printf 'GRAFANA_URL=%s\n' "${GRAFANA_URL}"
            fi
            # Sentry auth token for server-side issues API proxy
            if [[ -n "${SENTRY_AUTH_TOKEN:-}" ]]; then
              printf 'SENTRY_AUTH_TOKEN=%s\n' "${SENTRY_AUTH_TOKEN}"
            fi
            # Admin dashboard treasury (Load Test auto-fund, api.treasury.fund.ts). Reaches only the
            # admin-dashboard env file (scripts/render-service-env.sh), never another container.
            if [[ -n "${TREASURY_SEED:-}" ]]; then
              printf 'TREASURY_SEED=%s\n' "${TREASURY_SEED}"
            fi
          } | $SSH "sudo tee /tmp/secrets-patch.env > /dev/null && \
            sudo touch /opt/dcc/secrets/${NETWORK}.env && \
            sudo bash -c 'cat /tmp/secrets-patch.env /opt/dcc/secrets/${NETWORK}.env \
              | awk -F= \"!seen[\\\$1]++\" > /tmp/secrets-merged.env \
              && mv /tmp/secrets-merged.env /opt/dcc/secrets/${NETWORK}.env \
              && rm -f /tmp/secrets-patch.env \
              && chmod 640 /opt/dcc/secrets/${NETWORK}.env \
              && chown root:deploy /opt/dcc/secrets/${NETWORK}.env'"
          echo "[secrets-push] Secrets file updated (upsert — no duplicates)."

          # ── 1-seed. Seed-if-absent keys the per-service renderer requires ───────
          # A freshly provisioned host has none of these in the master file (bootstrap writes
          # BPS_CHAIN_ID, not DCC_CHAIN_ID). An existing line is never overwritten, so live values
          # stay byte-identical. Values go over stdin, never into a command line or the log.
          case "${NETWORK}" in
            testnet)  SEED_CHAIN_ID="33" ;;
            stagenet) SEED_CHAIN_ID="83" ;;
            mainnet)  SEED_CHAIN_ID="63" ;;
            *)        echo "[secrets-push] ERROR: unknown NETWORK '${NETWORK}' — cannot derive DCC_CHAIN_ID"; exit 1 ;;
          esac
          # shellcheck disable=SC2016  # runs on the server, not here
          SEED_SH='f=$1; [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ] && echo >> "$f"; while IFS= read -r l; do k=${l%%=*}; grep -q "^${k}=" "$f" || printf "%s\n" "$l" >> "$f"; done'
          {
            printf 'DCC_CHAIN_ID=%s\n'                  "${SEED_CHAIN_ID}"
            printf 'ADMIN_DASHBOARD_PG_DATABASE=admin_%s\n' "${NETWORK}"
            if [[ -n "${REDIS_PASS:-}" ]]; then
              printf 'REDIS_URL=redis://:%s@127.0.0.1:6379/\n' "${REDIS_PASS}"
            fi
          } | $SSH "sudo bash -c '${SEED_SH}' seed /opt/dcc/secrets/${NETWORK}.env"
          echo "[secrets-push] Seeded absent DCC_CHAIN_ID / ADMIN_DASHBOARD_PG_DATABASE / REDIS_URL (existing lines untouched)."

          # ── 1b. Grafana admin password → its own env file ───────────────────
          # compose/grafana.yml reads ONLY this file (env_file), so the
          # internet-facing Grafana container never gets the node wallet seed or
          # the other values in ${NETWORK}.env. SOPS key: GRAFANA_ADMIN_PASSWORD
          # (KeeWeb entry of the same name). Grafana applies it only when it
          # first creates the admin user. For an existing grafana-data volume,
          # rotate once with `grafana cli admin reset-admin-password` (see
          # compose/grafana.yml).
          if [[ -n "${GRAFANA_ADMIN_PASS:-}" ]]; then
            printf 'GF_SECURITY_ADMIN_PASSWORD=%s\n' "${GRAFANA_ADMIN_PASS}" \
              | $SSH "sudo tee /opt/dcc/secrets/grafana-${NETWORK}.env > /dev/null && \
                      sudo chmod 640 /opt/dcc/secrets/grafana-${NETWORK}.env && \
                      sudo chown root:deploy /opt/dcc/secrets/grafana-${NETWORK}.env"
            echo "[secrets-push] Grafana admin env file written."
          else
            echo "[secrets-push] WARNING: GRAFANA_ADMIN_PASSWORD not in SOPS — /opt/dcc/secrets/grafana-${NETWORK}.env not written; compose/grafana.yml will refuse to start until it exists."
          fi

          # ── 2. Set real postgres password (SQL dollar-quoting) ──────────────
          # Dollar-quoted literals are immune to single-quote injection.
          # Tag '$dccpw$' will not appear in any real password.
          $SSH "sudo -u postgres psql" << PGEOF
          ALTER ROLE dcc WITH PASSWORD \$dccpw\$${PG_PASS}\$dccpw\$;
          PGEOF
          echo "[secrets-push] Postgres password set."

          # ── 3. Write matcher config ──────────────────────────────────────────
          # scripts/render-matcher-local-conf.sh is the ONE writer of local.conf (push-secrets-local.sh
          # uses it too). Rendered into a variable first: a render failure must abort BEFORE the remote
          # `tee` truncates the live file (an empty local.conf = in-mem KeyPair(empty)).
          CHAIN_ID=$($SSH "grep '^CHAIN_ID=' /opt/dcc/secrets/${NETWORK}.env | cut -d= -f2" 2>/dev/null || true)
          if [[ -z "${CHAIN_ID}" ]]; then
            case "${NETWORK}" in
              testnet)  CHAIN_ID="33" ;;
              stagenet) CHAIN_ID="83" ;;
              mainnet)  CHAIN_ID="63" ;;
              *)        echo "[secrets-push] ERROR: unknown NETWORK '${NETWORK}' — cannot derive CHAIN_ID"; exit 1 ;;
            esac
            echo "[secrets-push] CHAIN_ID not found in secrets file — defaulting to ${CHAIN_ID} for ${NETWORK}"
          fi
          MATCHER_CONF=$(NETWORK="${NETWORK}" CHAIN_ID="${CHAIN_ID}" MATCHER_SEED_B64="${MATCHER_SEED_B64}" \
            MATCHER_HASH="${MATCHER_HASH}" bash scripts/render-matcher-local-conf.sh)
          printf '%s\n' "${MATCHER_CONF}" | $SSH "sudo tee /opt/dcc/config/matcher-${NETWORK}/local.conf.new > /dev/null && \
                    sudo chown root:113 /opt/dcc/config/matcher-${NETWORK}/local.conf.new && \
                    sudo chmod 640 /opt/dcc/config/matcher-${NETWORK}/local.conf.new && \
                    sudo mv -f /opt/dcc/config/matcher-${NETWORK}/local.conf.new /opt/dcc/config/matcher-${NETWORK}/local.conf"
          unset MATCHER_CONF
          # 640 root:113: the file holds the matcher's seed. 113 is the matcher container's uid/gid
          # (decentralchain-dex), which reads it through the read-only bind mount; other host users cannot.
          echo "[secrets-push] Matcher config written (in-mem account storage, real key ${DEFAULT_MATCHER})."

          # ── 4. Per-service env files (least privilege) ──────────────────────
          # Each container reads ONLY /opt/dcc/secrets/<service>-<network>.env (compose/*.yml
          # env_file). Values are copied byte-for-byte from the master file above; no container
          # mounts the master file. Runs LAST so a missing required key cannot abort the postgres,
          # matcher or grafana steps; the job still fails (exit below) if any service was skipped.
          RENDER_RC=0
          $SSH "sudo OWNER=root:deploy bash -s -- ${NETWORK} /opt/dcc/secrets/${NETWORK}.env /opt/dcc/secrets" \
            < scripts/render-service-env.sh || RENDER_RC=$?

          rm -f /tmp/deploy_key
          if [[ "${RENDER_RC}" -ne 0 ]]; then
            echo "[secrets-push] FATAL: per-service env render failed (exit ${RENDER_RC}); see render-service-env lines above."
            exit "${RENDER_RC}"
          fi
          echo "[secrets-push] Per-service env files written."
          echo "[secrets-push] Done. All sensitive secrets injected directly. Linode saw none."
