name: Infra Liveness (Tier 0)

# Off-box safety net, every 3 hours. The 30-minute probe itself runs IN-CLUSTER (LKE CronJob
# `infra-liveness`, clusters/testnet/apps/monitors, runbooks/in-cluster-monitors.md): it used to be
# dispatched here 48 times a day (2.7 min each), and every Actions minute in any repo counts
# against the org's free pool. What stays here is what only an off-box observer can see:
#   - the main node is producing blocks (public REST), the LKE pool is up (Linode API), Flux reconciles;
#   - the alerting deadman: Alertmanager still holds `Watchdog` and alert-webhook is healthy
#     (Prometheus/Alertmanager run on the VPS they watch, localhost only);
#   - the in-cluster monitors themselves still run (nothing else would notice them dying).
# The 2026-09-17 Linode outage went unnoticed for 6+ days: canary-transaction was already red for
# an unrelated reason, drift-detect ignored power state and healthchecks only tested REST liveness.
# This opens (or comments on) one alert issue per outage.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: infra-liveness
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # One sample against the block timestamp instead of the old 150 s double sample (every second
      # of this job is billed; the in-cluster probe still does the two-sample height check).
      - name: Main node producing blocks
        run: |
          set -euo pipefail
          TS=$(curl -sf -m 15 https://testnet-node.decentralchain.io/blocks/last | jq -r .timestamp)
          AGE=$(( $(date +%s) - TS / 1000 ))
          echo "last block age: ${AGE}s"
          test "$AGE" -lt 600 || { echo "::error::main node last block is ${AGE}s old"; exit 1; }

      - name: LKE pool nodes ready
        # Run even when the main-node probe failed, so one alert reports both halves.
        if: ${{ !cancelled() }}
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
        run: |
          set -euo pipefail
          CID=$(curl -sf -m 15 -H "Authorization: Bearer $LINODE_TOKEN" https://api.linode.com/v4/lke/clusters \
            | jq -r '.data[] | select(.label=="dcc-peer-testnet") | .id')
          test -n "$CID" || { echo "::error::LKE cluster dcc-peer-testnet not found"; exit 1; }
          NOTREADY=$(curl -sf -m 15 -H "Authorization: Bearer $LINODE_TOKEN" "https://api.linode.com/v4/lke/clusters/$CID/pools" \
            | jq '[.data[].nodes[] | select(.status!="ready")] | length')
          echo "not-ready pool nodes: $NOTREADY"
          test "$NOTREADY" -eq 0 || { echo "::error::$NOTREADY LKE pool node(s) not ready"; exit 1; }

      - name: Checkout (pinned SSH host key + scripts)
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Prometheus + Alertmanager run on the VPS they watch, so they cannot report their own death.
      # alerts.yml `Watchdog` is always firing and routed to a silent receiver; if Alertmanager does
      # not hold it, rule evaluation or delivery to Alertmanager is broken. The GitHub-issue
      # receiver (alert-webhook) must also be healthy.
      - name: Alerting pipeline alive (deadman)
        if: ${{ !cancelled() }}
        env:
          DEPLOY_KEY:  ${{ secrets.TESTNET_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.TESTNET_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TESTNET_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ./scripts/ssh-setup.sh "$DEPLOY_HOST"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          curl -sf -m 10 'http://127.0.0.1:9093/api/v2/alerts?filter=alertname%3D%22Watchdog%22' \
            | python3 -c 'import json,sys; a=json.load(sys.stdin); sys.exit(0 if any(x["labels"].get("alertname")=="Watchdog" for x in a) else 1)' \
            || { echo "::error::Watchdog is missing from Alertmanager: Prometheus rule evaluation or alert delivery is down"; exit 1; }
          curl -sf -m 10 -o /dev/null http://127.0.0.1:9099/healthz \
            || { echo "::error::alert-webhook /healthz failing: alerts cannot reach GitHub issues"; exit 1; }
          echo "deadman OK: Watchdog held by Alertmanager, alert-webhook healthy"
          REMOTE

      # Flux has no notification-controller and no metrics scrape, so a failing reconcile used to
      # freeze the cluster spec silently. Suspended Kustomizations only warn: staggered rollouts
      # (runbooks/staggered-node-rollout.md) suspend on purpose.
      - name: Flux reconciling
        if: ${{ !cancelled() }}
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
        run: |
          set -euo pipefail
          CID=$(curl -sf -m 15 -H "Authorization: Bearer $LINODE_TOKEN" https://api.linode.com/v4/lke/clusters \
            | jq -r '.data[] | select(.label=="dcc-peer-testnet") | .id')
          test -n "$CID" || { echo "::error::LKE cluster dcc-peer-testnet not found"; exit 1; }
          umask 077
          curl -sf -m 15 -H "Authorization: Bearer $LINODE_TOKEN" "https://api.linode.com/v4/lke/clusters/$CID/kubeconfig" \
            | jq -r .kubeconfig | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io -n flux-system -o json > "$RUNNER_TEMP/ks.json"
          python3 - "$RUNNER_TEMP/ks.json" <<'PY'
          import json, sys
          bad = []
          for k in json.load(open(sys.argv[1]))["items"]:
              name = k["metadata"]["name"]
              if k["spec"].get("suspend"):
                  print(f"::warning::Kustomization {name} is SUSPENDED (expected only during a staggered rollout)")
                  continue
              ready = next((c for c in k.get("status", {}).get("conditions", []) if c["type"] == "Ready"), {})
              print(f"{name}: Ready={ready.get('status')} rev={k.get('status', {}).get('lastAppliedRevision', '?')}")
              if ready.get("status") != "True":
                  bad.append(f"{name}: {ready.get('reason')} {ready.get('message', '')[:200]}")
          if bad:
              print("::error::Flux Kustomization(s) not Ready: " + "; ".join(bad))
              sys.exit(1)
          PY
          # AUD-195: controller restarts are recorded on every run (the 45h co-restart was never explained).
          kubectl get pods -n flux-system --no-headers \
            -o custom-columns=NAME:.metadata.name,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount
          NOTREADY=$(kubectl get pods -n flux-system -o json | jq '[.items[] | select(.status.containerStatuses[0].ready != true)] | length')
          test "$NOTREADY" -eq 0 || { echo "::error::$NOTREADY flux-system controller pod(s) not ready"; exit 1; }

      # The in-cluster monitors replaced the GitHub-dispatched checks, so this is the only thing that
      # sees them stop (CronJob not scheduled) or fail silently (no alert issue open).
      - name: In-cluster monitors still running
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          kubectl get cronjobs -n dcc -o json > "$RUNNER_TEMP/cronjobs.json"
          gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 100 --json title -q '[.[].title]' > "$RUNNER_TEMP/issue-titles.json"
          python3 scripts/check-monitor-cronjobs.py "$RUNNER_TEMP/cronjobs.json" "$RUNNER_TEMP/issue-titles.json"

      - name: Open or update alert issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="[ALERT] InfraLiveness: testnet liveness, alerting deadman or Flux check failed"
          N=$(gh issue list -R "$GITHUB_REPOSITORY" --search "\"$TITLE\" in:title" --state open --json number -q '.[0].number')
          if [ -z "$N" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "Run: $RUN_URL"
          else
            gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          fi
