# ──────────────────────────────────────────────────────────────────────────────
# Canary Transaction (Tier 6 synthetic monitoring)
#
# Submits a real, minimal-value transfer against the live testnet on a schedule,
# using a dedicated canary wallet (DCC_CANARY_SEED, provisioned via SOPS + this
# repo's push-secrets.yml — see secrets/testnet.env's DCC_CANARY_SEED entry).
#
# The transfer is a self-transfer: the canary account sends to its own address
# (derived from its seed via @decentralchain/ts-lib-crypto's `address`), so no
# second funded account needs to be created or maintained.
#
# Failure (broadcast rejected, or not confirmed within the timeout) opens a
# GitHub Issue using the exact same title/label convention monitoring/alert-webhook.py
# already uses for every other testnet alert (title prefix `[ALERT] {name}`,
# labels `alert` + `severity:{sev}`), so this failure mode surfaces in the same
# place as Alertmanager-driven alerts.
# ──────────────────────────────────────────────────────────────────────────────

name: Canary Transaction (Tier 6 synthetic monitoring)

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 min
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testnet

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Install signing/broadcast dependencies
        run: npm install --no-save @decentralchain/transactions@latest @decentralchain/ts-lib-crypto@latest

      - name: Sign, broadcast, and confirm a minimal canary transfer
        id: canary
        env:
          DCC_CANARY_SEED: ${{ secrets.DCC_CANARY_SEED }}
        run: |
          cat <<'EOF' > /tmp/canary.mjs
          import { transfer, broadcast, waitForTx } from '@decentralchain/transactions';
          import { address } from '@decentralchain/ts-lib-crypto';

          const API_BASE = 'https://testnet-node.decentralchain.io/';
          const CHAIN_ID = '!'; // matches DCC_TEST_CHAIN_ID used elsewhere in this project's E2E config
          const SEED = process.env.DCC_CANARY_SEED;

          if (!SEED) {
            console.error('Canary tx failed: DCC_CANARY_SEED is not set');
            process.exit(1);
          }

          // Self-transfer: avoids needing a second funded account to maintain.
          const recipient = address(SEED, CHAIN_ID);

          const start = Date.now();
          const tx = transfer({ amount: 100_000, chainId: CHAIN_ID, recipient }, SEED);

          try {
            await broadcast(tx, API_BASE);
            const confirmed = await waitForTx(tx.id, { apiBase: API_BASE, timeout: 120_000 });
            const latencyMs = Date.now() - start;
            console.log(`Canary tx ${tx.id} confirmed at height ${confirmed.height} in ${latencyMs}ms`);
            process.exit(0);
          } catch (err) {
            console.error(`Canary tx failed: ${err?.message ?? err}`);
            process.exit(1);
          }
          EOF
          node /tmp/canary.mjs

      - name: Open a GitHub Issue on failure (matches alert-webhook.py's issue format)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="[ALERT] CanaryTransactionFailed"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label alert --state open --json title,number \
            --jq ".[] | select(.title | startswith(\"$PREFIX\")) | .number" | head -1)
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "$PREFIX: canary transaction did not confirm against testnet" \
              --label alert --label severity:high \
              --body "## HIGH — canary transaction did not confirm against testnet

          **Network:** testnet
          **Alert:** \`CanaryTransactionFailed\`
          **Severity:** high
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > Auto-opened by the canary-transaction workflow (Tier 6 synthetic monitoring). Close when resolved."
          else
            echo "Alert CanaryTransactionFailed already open as issue #$EXISTING — not creating a duplicate."
          fi
