# ──────────────────────────────────────────────────────────────────────────────
# Canary Transaction (Tier 6 synthetic monitoring): MANUAL run.
#
# The scheduled canary runs IN-CLUSTER (LKE CronJob `canary-transaction`, every 15 min,
# clusters/testnet/apps/monitors, runbooks/in-cluster-monitors.md). It used to be dispatched from
# here about 100 times a day; every run is an Actions run counted against the org's free minutes,
# so the schedule moved off GitHub. This workflow stays for manual runs ("is the canary path
# healthy right now?") and executes the SAME script as the CronJob.
#
# The transfer is a self-transfer from the canary wallet (DCC_CANARY_SEED, environment `testnet`
# secret; the same seed is in the cluster Secret `monitors`, SOPS-encrypted). An unfunded wallet is
# its own alert (`CanaryWalletUnfunded`, exit 3, issue #148); re-fund from the treasury.
# Failure opens a GitHub Issue in the alert-webhook.py format (`[ALERT] {name}`, labels `alert` +
# `severity:{sev}`), deduplicated against an already open one.
# ──────────────────────────────────────────────────────────────────────────────

name: Canary Transaction (Tier 6 synthetic monitoring)

on:
  workflow_dispatch: {}

concurrency:
  group: canary-transaction
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testnet

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      # Installed next to the script (Node's ESM resolver looks for node_modules from the importing
      # file's directory). Same exact versions as the CronJob (scripts/run-canary.sh).
      - name: Install signing/broadcast dependencies (exact versions)
        run: npm install --no-save --no-audit --no-fund --prefix clusters/testnet/apps/monitors/scripts @decentralchain/transactions@5.0.1 @decentralchain/ts-lib-crypto@2.0.0

      - name: Sign, broadcast, and confirm a minimal canary transfer
        id: canary
        env:
          DCC_CANARY_SEED: ${{ secrets.DCC_CANARY_SEED }}
        run: |
          rc=0
          node clusters/testnet/apps/monitors/scripts/canary-transaction.mjs || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "reason=unfunded" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            echo "reason=failed" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Open a GitHub Issue on failure (matches alert-webhook.py's issue format)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.canary.outputs.reason }}
        run: |
          if [ "$REASON" = "unfunded" ]; then
            NAME="CanaryWalletUnfunded"
            SUMMARY="canary wallet balance is below 10x the tx fee (re-fund from treasury)"
          else
            NAME="CanaryTransactionFailed"
            SUMMARY="canary transaction did not confirm against testnet"
          fi
          PREFIX="[ALERT] $NAME"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label alert --state open --json title,number \
            --jq ".[] | select(.title | startswith(\"$PREFIX\")) | .number" | head -1)
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "$PREFIX: $SUMMARY" \
              --label alert --label severity:high \
              --body "## HIGH — $SUMMARY

          **Network:** testnet
          **Alert:** \`$NAME\`
          **Severity:** high
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > Auto-opened by a manual run of canary-transaction.yml. Close when resolved."
          else
            echo "Alert $NAME already open as issue #$EXISTING — not creating a duplicate."
          fi
