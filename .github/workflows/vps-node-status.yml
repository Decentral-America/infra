name: VPS Node Status
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'manual'
  workflow_call:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Query VPS node finality and services
        env:
          DEPLOY_KEY:  ${{ secrets.TESTNET_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.TESTNET_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.TESTNET_DEPLOY_USER }}
        run: |
          ./scripts/ssh-setup.sh "$SSH_HOST"
          ssh \
            "${SSH_USER}@${SSH_HOST}" \
            'set +e
             echo "=== Finality ==="
             H=$(curl -s http://localhost:6869/blocks/height 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)[\"height\"])" 2>/dev/null)
             F=$(curl -s http://localhost:6869/blocks/height/finalized 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)[\"height\"])" 2>/dev/null)
             echo "H: $H Finalized: $F Lag: $(( ${H:-0} - ${F:-0} ))"
             echo "=== HotStuff round latency (Kamon) ==="
             curl -s http://localhost:6870/metrics 2>/dev/null | grep -E "^hotstuff_round_latency" | grep -v "_bucket\|_sum\|_count" | head -5
             echo "=== BPS block count ==="
             sudo -u postgres psql -d bps_testnet -t -c "SELECT count(*) FROM blocks_microblocks;" 2>/dev/null
             echo "=== All running containers ==="
             docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.CreatedAt}}" 2>/dev/null || echo "(docker error)"
             echo "=== Matcher last 20 log lines ==="
             docker logs matcher-testnet --tail 20 2>&1 | grep -v "^$" || echo "(no matcher logs)"
             echo "=== Listening ports (ss) ==="
             ss -tlnp 2>/dev/null | grep -E "LISTEN|Local Address" | head -20 || echo "UNREACHABLE"
             echo "=== Matcher volume / account.dat check ==="
             ls -la /opt/dcc/data/matcher-testnet/ 2>/dev/null || echo "dir missing"
             echo "=== Matcher local.conf (secrets redacted) ==="
             sudo -n sed -E "s/(seed[^=]*=[[:space:]]*).*/\1[REDACTED]/I; s/(password[[:space:]]*=[[:space:]]*).*/\1[REDACTED]/I; s/(api-key-hashes[[:space:]]*=[[:space:]]*).*/\1[REDACTED]/I" /opt/dcc/config/matcher-testnet/local.conf 2>/dev/null || echo "(no config)"
             echo "=== Redis auth status (password never printed) ==="
             REDIS_PASS=$(grep "^REDIS_PASSWORD=" /opt/dcc/secrets/testnet.env 2>/dev/null | cut -d= -f2-)
             if [ -z "$REDIS_PASS" ]; then
               echo "REDIS_PASSWORD not found in secrets file"
             else
               NOAUTH_RESULT=$(docker exec redis-testnet env -u REDISCLI_AUTH redis-cli -h 127.0.0.1 ping 2>&1)
               AUTH_RESULT=$(docker exec redis-testnet redis-cli -h 127.0.0.1 -a "$REDIS_PASS" ping 2>&1 | tail -1)
               echo "ping without password: $NOAUTH_RESULT"
               echo "ping with secrets-file password: $AUTH_RESULT"
             fi
             echo "=== Main node InvalidStateHash count since container start ==="
             ISH=$(docker logs node-scala-testnet 2>&1 | grep -c "InvalidStateHash")
             echo "InvalidStateHash lines: $ISH (container started: $(docker inspect -f "{{.State.StartedAt}}" node-scala-testnet 2>/dev/null))"
             echo "=== Matcher log grep for Redis auth errors ==="
             MATCHER_REDIS_LINES=$(docker logs matcher-testnet --since 24h 2>&1 | grep -i "NOAUTH\|WRONGPASS\|redis" | tail -10)
             if [ -z "$MATCHER_REDIS_LINES" ]; then
               echo "(no redis-related matcher log lines in last 24h)"
             else
               echo "$MATCHER_REDIS_LINES"
             fi
             echo "=== Container memory (docker stats), restarts and OOM kills ==="
             docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}" 2>/dev/null
             for c in $(docker ps -aq); do
               docker inspect -f "{{.Name}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} started={{.State.StartedAt}}" "$c" 2>/dev/null
             done
             echo "=== Host memory ==="
             free -m
             echo "=== Prometheus: usage ratio, 6h max / 24h max, by container ==="
             for q in "max_over_time((dcc_container_memory_usage_bytes/dcc_container_memory_limit_bytes)[6h:5m])" "max_over_time((dcc_container_memory_usage_bytes/dcc_container_memory_limit_bytes)[24h:5m])"; do
               curl -s --max-time 20 http://127.0.0.1:9091/api/v1/query --data-urlencode "query=$q" | python3 -c "import json,sys; [print(r[\"metric\"].get(\"name\"), round(float(r[\"value\"][1]),3)) for r in json.load(sys.stdin)[\"data\"][\"result\"]]" 2>/dev/null
               echo "--"
             done
             echo "=== Prometheus: loki and alloy Go heap vs working set (now / 24h max) ==="
             for q in "go_memstats_heap_inuse_bytes{job=~\"loki|alloy\"}" "max_over_time(go_memstats_heap_inuse_bytes{job=~\"loki|alloy\"}[24h])" "go_memstats_heap_idle_bytes{job=~\"loki|alloy\"}" "go_memstats_heap_released_bytes{job=~\"loki|alloy\"}" "go_memstats_sys_bytes{job=~\"loki|alloy\"}" "process_resident_memory_bytes{job=~\"loki|alloy\"}" "dcc_container_memory_usage_bytes{name=~\"loki.*|alloy.*\"}" "max_over_time(dcc_container_memory_usage_bytes{name=~\"loki.*|alloy.*\"}[24h])" "min_over_time(dcc_container_memory_usage_bytes{name=~\"loki.*|alloy.*\"}[24h])" "loki_ingester_memory_chunks" "loki_ingester_memory_streams" "rate(loki_distributor_bytes_received_total[1h])*3600" "changes(process_start_time_seconds{job=~\"loki|alloy\"}[2d])"; do
               echo "# $q"
               curl -s --max-time 20 http://127.0.0.1:9091/api/v1/query --data-urlencode "query=$q" | python3 -c "import json,sys; [print(r[\"metric\"].get(\"job\") or r[\"metric\"].get(\"name\"), r[\"value\"][1]) for r in json.load(sys.stdin)[\"data\"][\"result\"]]" 2>/dev/null
             done
             echo "=== Prometheus: Loki memory profile over 24h (loki working set, 1h steps) ==="
             curl -s --max-time 20 http://127.0.0.1:9091/api/v1/query_range --data-urlencode "query=dcc_container_memory_usage_bytes{name=\"loki-testnet\"}/1048576" --data-urlencode "start=$(date -d -24hours +%s)" --data-urlencode "end=$(date +%s)" --data-urlencode "step=3600" | python3 -c "import json,sys; [print(\" \".join(\"%.0f\" % float(v[1]) for v in r[\"values\"])) for r in json.load(sys.stdin)[\"data\"][\"result\"]]" 2>/dev/null
             echo "=== Loki on-disk size / dmesg OOM lines ==="
             sudo -n du -sh /var/lib/docker/volumes/loki-data-testnet 2>/dev/null
             sudo -n dmesg -T 2>/dev/null | grep -i "killed process\|out of memory" | tail -5 || true'
