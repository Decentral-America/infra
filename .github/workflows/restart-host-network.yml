name: Restart Main Node With Chain Wipe
# DESTRUCTIVE: removes the main node container, WIPES its chain data (data/ and peers.dat in the
# node-state-testnet volume) and starts it again on the pinned image through scripts/node-up.sh.
# Only for a deliberate re-genesis or an unrecoverable local state. For an image or config
# change use update-node-image.yml / deploy-node-config.yml (no wipe).
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'This wipes chain data. Type WIPE-CONFIRMED to proceed.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: main-node-deploy
  cancel-in-progress: false
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testnet
    steps:
      - name: Require explicit confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "WIPE-CONFIRMED" ]; then
            echo "::error::This wipes the main node's chain data. Re-run with confirm set to exactly WIPE-CONFIRMED."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned VPS image digest
        id: image
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source node-config/testnet/vps-image.env
          [[ "${NODE_SCALA_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::vps-image.env must pin a digest"; exit 1; }
          echo "image=${NODE_SCALA_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH (pinned host key)
        env:
          DEPLOY_KEY: ${{ secrets.TESTNET_DEPLOY_SSH_KEY }}
          SSH_HOST:   ${{ secrets.TESTNET_DEPLOY_HOST }}
        run: ./scripts/ssh-setup.sh "$SSH_HOST"

      - name: Wipe chain data and start the node
        env:
          SSH_HOST:   ${{ secrets.TESTNET_DEPLOY_HOST }}
          SSH_USER:   ${{ secrets.TESTNET_DEPLOY_USER }}
          NODE_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          scp scripts/node-up.sh "${SSH_USER}@${SSH_HOST}:/tmp/"
          scp compose/node-scala.yml "${SSH_USER}@${SSH_HOST}:/opt/dcc/compose/node-scala.yml"
          # shellcheck disable=SC2029  # NODE_IMAGE is expanded locally on purpose
          ssh "${SSH_USER}@${SSH_HOST}" "set -euo pipefail
            docker rm -f node-scala-testnet || true
            docker run --rm -v node-state-testnet:/data alpine:3.22 sh -c 'rm -rf /data/data /data/peers.dat && echo WIPED'
            bash /tmp/node-up.sh '${NODE_IMAGE}' testnet; rc=\$?; rm -f /tmp/node-up.sh; exit \$rc"
