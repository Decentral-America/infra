# ── Calico controller configuration ──────────────────────────────────────────
# Keeps Calico's automatic HostEndpoints enabled. This object is live and
# managed by Flux (kustomize-controller); do not delete it.
#
# The staged global network policy that used to live here (dcc-hostendpoint-p2p,
# staged since 2026-07-05) was removed on 2026-10-18 (audit AUD-131): it
# selected nothing (the auto-created HostEndpoint has no `kubernetes-host`
# label), so it neither logged nor enforced anything. NetworkPolicy objects do
# not apply to the hostNetwork pods (gen-0, gen-1, val-0, metrics-exporter);
# the enforced perimeter is the Linode Cloud Firewall (terraform/lke.tf).
apiVersion: crd.projectcalico.org/v1
kind: KubeControllersConfiguration
metadata:
  name: default
spec:
  controllers:
    node:
      hostEndpoint:
        autoCreate: Enabled
