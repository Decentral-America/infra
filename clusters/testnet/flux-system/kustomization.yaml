apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Right-sizing for the one-node "shared 8 GB bundle" (one g6-standard-4 running
# gen-0, gen-1 and val-0). Only source-controller and kustomize-controller are
# installed (gotk-components.yaml header). This repo has one GitRepository and
# four small Kustomizations, so the upstream defaults (requests 50m/100m CPU,
# limits 1 CPU / 1Gi each) reserve far more than is used.
#
# Patched here, not in gotk-components.yaml: that file is regenerated by
# `flux install --export` / `flux bootstrap` / Renovate's flux manager, and Flux
# documents patches in flux-system/kustomization.yaml as the way to customise
# controller resources (fluxcd.io "Flux installation configuration", vertical
# scaling). `flux bootstrap` keeps this file's patches.
#
# Requests are the memory each controller actually needs at this scale, so the
# scheduler accounts for it on the shared node. Limits stay roomy: kustomize-
# controller builds and server-side-applies the whole tree (including Flux's
# own CRDs) and decrypts SOPS secrets with the sops-age key, and its memory
# peaks on a cold reconcile after a restart.
patches:
- target:
    kind: Deployment
    name: source-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: source-controller
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
- target:
    kind: Deployment
    name: kustomize-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: kustomize-controller
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                cpu: 500m
                memory: 512Mi
