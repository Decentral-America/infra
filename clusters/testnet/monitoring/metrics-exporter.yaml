# ── DCC Chain Metrics Exporter ───────────────────────────────────────────────
# Scrapes each node's REST API (gen-0/gen-1/val-0, localhost via hostNetwork)
# and exposes dcc_block_height / dcc_blockchain_height_age_seconds per node.
#
# This is the ONLY monitoring component in the cluster. There is no in-cluster
# Prometheus/Grafana/Alertmanager: the VPS monitoring plane (compose/prometheus.yml,
# compose/grafana.yml, monitoring/) scrapes this exporter DIRECTLY through the
# NodePort Service below (job `lke-chain` in monitoring/prometheus.yml). The path
# is opened by terraform/lke.tf `allow-chain-exporter-nodeport` (inbound, VPS IP
# only) and terraform/main.tf `allow-lke-exporter-out` (VPS egress, LKE node IPs
# only). Keep the nodePort below in sync with local.lke_chain_exporter_nodeport
# in terraform/lke.tf.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: exporter-script
  namespace: dcc
data:
  exporter.py: |
    #!/usr/bin/env python3
    """
    Minimal Prometheus exporter for DCC node-scala REST API.
    Scrapes /blocks/height and /node/status from each node.
    Exposes on :9200/metrics; the VPS Prometheus scrapes it via NodePort 32092.
    """
    import http.server, urllib.request, json, time, os

    NODES = [
        ("gen-0", "http://127.0.0.1:6869"),
        ("gen-1", "http://127.0.0.1:6870"),
        ("val-0", "http://127.0.0.1:6871"),
    ]
    PORT = int(os.getenv("EXPORTER_PORT", "9200"))

    def fetch(url):
        try:
            with urllib.request.urlopen(url, timeout=4) as r:
                return json.loads(r.read())
        except Exception:
            return None

    def metrics():
        lines = []
        lines.append('# HELP dcc_block_height Current blockchain height')
        lines.append('# TYPE dcc_block_height gauge')
        lines.append('# HELP dcc_blockchain_height_age_seconds Seconds since last block was added (0 if advancing)')
        lines.append('# TYPE dcc_blockchain_height_age_seconds gauge')

        for name, base in NODES:
            h = fetch(f"{base}/blocks/height")
            s = fetch(f"{base}/node/status")
            if h and "height" in h:
                lines.append(f'dcc_block_height{{node="{name}"}} {h["height"]}')
            if s and "updatedTimestamp" in s:
                age = max(0, (time.time() * 1000 - s["updatedTimestamp"]) / 1000)
                lines.append(f'dcc_blockchain_height_age_seconds{{node="{name}"}} {age:.1f}')

        return '\n'.join(lines) + '\n'

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/metrics':
                body = metrics().encode()
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain; version=0.0.4')
                self.send_header('Content-Length', len(body))
                self.end_headers()
                self.wfile.write(body)
            else:
                self.send_response(404); self.end_headers()
        def log_message(self, *_): pass

    http.server.HTTPServer(('0.0.0.0', PORT), Handler).serve_forever()

---
# Deploy as a DaemonSet-like pod on the same node (hostNetwork shares localhost)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-exporter
  namespace: dcc
  labels:
    app: metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-exporter
  template:
    metadata:
      labels:
        app: metrics-exporter
        network: testnet
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9200"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: exporter
          # python:3.14-slim — digest pinned to match compose/prometheus.yml's
          # exporter/alert-webhook services (same base image, kept in sync).
          image: python:3.14-slim@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
          command: ["python3", "/app/exporter.py"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534 # nobody — python:3.14-slim (Debian) has no dedicated non-root user
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: EXPORTER_PORT
              value: "9200"
          ports:
            - containerPort: 9200
              hostPort: 9200
              protocol: TCP
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9200
              host: 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: script
          configMap:
            name: exporter-script
            defaultMode: 0555

---
# NodePort, not ClusterIP: the scraper is the VPS Prometheus, outside the
# cluster. The pod is hostNetwork, so the endpoint is <node IP>:9200 and
# kube-proxy forwards <any node public IP>:32092 to it. 9200 itself is NOT
# opened in the Linode firewall; only 32092, and only from the VPS.
apiVersion: v1
kind: Service
metadata:
  name: metrics-exporter
  namespace: dcc
  labels:
    app: metrics-exporter
spec:
  type: NodePort
  selector:
    app: metrics-exporter
  ports:
    - name: metrics
      port: 9200
      targetPort: 9200
      nodePort: 32092
