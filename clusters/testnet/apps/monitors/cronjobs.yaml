apiVersion: batch/v1
kind: CronJob
metadata:
  name: infra-liveness
  namespace: dcc
  labels:
    app.kubernetes.io/part-of: monitors
spec:
  schedule: "20,50 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 420
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: monitors
            app: infra-liveness
        spec:
          restartPolicy: Never
          serviceAccountName: infra-liveness
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              image: python:3.14-slim@sha256:82abc9f53600280b0757126f83c5a7d47088592d2acb6b4c0b9e97f76865508c
              command: ["python3", "/app/infra-liveness.py"]
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: monitors
                      key: github-token
                - name: GITHUB_REPO
                  value: "Decentral-America/infra"
                - name: NODE_URL
                  value: "https://testnet-node.decentralchain.io"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /app
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: work
                  mountPath: /tmp
                  subPath: tmp
          volumes:
            - name: scripts
              configMap:
                name: monitor-scripts
                defaultMode: 0555
            - name: work
              emptyDir:
                sizeLimit: 512Mi
