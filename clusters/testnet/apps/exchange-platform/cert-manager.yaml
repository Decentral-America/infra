# ── cert-manager for the exchange stack on dcc-peer-testnet (615553) ─────────
# Same role=exchange-only node pool as ingress-nginx.yaml — never on the
# chain-node pool. ClusterIssuer config mirrors 513120's letsencrypt-prod
# exactly (same ACME account email, same http01/nginx solver) so the same
# domains can get certs issued here without any ACME-account surprises.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.jetstack.io

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: exchange
spec:
  interval: 1h
  # Live 2026-08-14: the first install failed because the startupapicheck hook
  # (calls the webhook via its short in-cluster DNS name) hit cold-start DNS
  # propagation delay right after the Service was created, exceeding the 5m
  # helm timeout. helm-controller does NOT auto-retry a failed install by
  # default (0 retries) - it just sits Failed until the spec changes. Retries
  # here so a one-off transient failure like that self-heals instead of
  # requiring manual intervention every time.
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: cert-manager
      version: v1.21.1 # verified current on charts.jetstack.io 2026-08-14
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    crds:
      enabled: true
    nodeSelector:
      role: exchange
    webhook:
      nodeSelector:
        role: exchange
    cainjector:
      nodeSelector:
        role: exchange
