# ── Ingress controller for the exchange stack on dcc-peer-testnet (615553) ───
# Deployed only on the dedicated `role=exchange` node pool (946807) added
# specifically for this migration — never on the chain-node pool that runs
# dcc-gen-0/dcc-gen-1/dcc-val-0, so the exchange web tier can never starve the
# consensus nodes for CPU/memory. type: LoadBalancer provisions a new Linode
# NodeBalancer automatically via the CCM already running on every LKE cluster
# (same mechanism 513120's ingress-nginx used) — a new public IP, not a reuse
# of 513120's.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes.github.io/ingress-nginx

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: exchange
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ingress-nginx
      version: 4.15.1 # app version 1.15.1, verified current on kubernetes.github.io/ingress-nginx 2026-08-14
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      nodeSelector:
        role: exchange
      service:
        type: LoadBalancer
      # Disabled 2026-08-14 after ~3h of failed reconciles: the API server
      # (Linode's managed control plane) could not reach this webhook's
      # Service even though pod-to-pod curl to the exact same Service worked
      # fine from inside the cluster the whole time - a control-plane-to-new-
      # node-pool routing gap, not a DNS/propagation blip (that class self-
      # healed in ~5m earlier for cert-manager's webhook; this one never did).
      # Likely specific to this being a SECOND node pool added to an existing
      # cluster rather than a fresh cluster - worth a Linode support ticket,
      # not something fixable from inside the cluster. The webhook is
      # optional defense-in-depth (pre-admission validation); the k8s API's
      # own OpenAPI schema check and nginx's own reload-time config check
      # still catch malformed Ingress objects, just post- rather than pre-
      # admission.
      admissionWebhooks:
        enabled: false
