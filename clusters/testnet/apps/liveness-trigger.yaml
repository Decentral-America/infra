# External scheduler for the testnet health workflows. GitHub's own cron has run 4-8h late org-wide
# since 2026-08-27, so outages went unnoticed for hours. This CronJob dispatches the workflows on
# time; their GitHub schedules stay as a backup. It replaces the Cloudflare Worker in
# workers/liveness-trigger (never deployable: the org Cloudflare token lacks Workers Scripts:Edit)
# with the same schedule: canary-transaction.yml every 15 min, infra-liveness.yml every 30 min.
# Running on LKE keeps it independent of the VPS main node it is meant to watch.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: liveness-trigger
  namespace: dcc
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: liveness-trigger
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dispatch
              image: curlimages/curl@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: liveness-trigger
                      key: github-token
                - name: GITHUB_REPO
                  value: Decentral-America/infra
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  dispatch() {
                    code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
                      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      -H 'Accept: application/vnd.github+json' \
                      -H 'X-GitHub-Api-Version: 2022-11-28' \
                      -H 'User-Agent: dcc-liveness-trigger' \
                      "https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/$1/dispatches" \
                      -d '{"ref":"main"}')
                    if [ "$code" = 204 ]; then echo "dispatched $1"; else echo "dispatch $1 -> HTTP $code: $(head -c 200 /tmp/resp)"; return 1; fi
                  }
                  rc=0
                  dispatch canary-transaction.yml || rc=1
                  # infra-liveness every 30 min: on the :00 and :30 ticks.
                  if [ $(( $(date -u +%M) % 30 )) -lt 15 ]; then dispatch infra-liveness.yml || rc=1; fi
                  exit $rc
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]

---
# default-deny-all covers this namespace; allow only DNS and HTTPS out from the trigger.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: liveness-trigger-egress
  namespace: dcc
spec:
  podSelector:
    matchLabels:
      app: liveness-trigger
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
