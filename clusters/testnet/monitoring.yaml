# Flux Kustomization for clusters/testnet/monitoring/: the chain metrics-exporter
# and its NodePort, nothing else. The in-cluster kube-prometheus-stack (and with
# it helm-controller, the monitoring namespace and the monitoring-secrets Secret)
# was removed: the VPS runs the one Prometheus/Alertmanager/Grafana and scrapes
# this exporter directly. No SOPS files live here, so no decryption block, and no
# postBuild substitution is needed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/testnet/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The exporter runs in the dcc namespace, which apps creates.
  dependsOn:
    - name: apps
