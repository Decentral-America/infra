global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    network: testnet

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
      timeout: 10s

scrape_configs:
  - job_name: dcc-chain
    static_configs:
      - targets: ['127.0.0.1:9101']
    relabel_configs:
      - target_label: network
        replacement: testnet
  # BPS now exposes bps_up / bps_last_synced_height at :9090/metrics
  # (blockchain-postgres-sync/src/bin/consumer.rs).
  - job_name: bps
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9090']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # Host disk/CPU/memory (compose/prometheus.yml node-exporter). Feeds HostDiskSpaceLow.
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # System Postgres (compose/prometheus.yml postgres-exporter, role dcc). Feeds
  # PostgresDatabaseGrowthHigh via pg_database_size_bytes{datname="bps_testnet"}.
  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:9187']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # Loki metrics — ingestion rate, chunk/index store ops, compaction lag.
  # Loki exposes Prometheus-format metrics at :3100/metrics.
  - job_name: loki
    static_configs:
      - targets: ['127.0.0.1:3100']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # Alloy metrics (Promtail's successor — see compose/loki.yml). Metric names
  # differ from Promtail's own (grafana/alloy's convert tool flagged this) —
  # no existing alert rule references promtail-specific metrics, so nothing
  # else needed updating.
  - job_name: alloy
    static_configs:
      - targets: ['127.0.0.1:12345']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # redis_exporter — connected_clients, keyspace hit ratio, memory, persistence
  # (rdb_last_save/aof_last_write_status), evicted_keys. See compose/redis.yml.
  - job_name: redis
    static_configs:
      - targets: ['127.0.0.1:9121']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # ── LKE chain metrics-exporter, scraped directly (no federation) ───────────
  # gen-0/gen-1/val-0 per-node chain metrics (dcc_block_height,
  # dcc_blockchain_height_age_seconds, label node=gen-0|gen-1|val-0) from
  # clusters/testnet/monitoring/metrics-exporter.yaml, through its NodePort
  # 32092. This replaced the `federate-lke` job: the cluster no longer runs its
  # own Prometheus, so this VPS Prometheus is the single monitoring plane.
  #
  # The target is NOT hardcoded. The LKE worker's public IP changes whenever the
  # cluster or its node is recreated, so deploy-monitoring-stack.yml writes
  # file_sd/lke-chain.json (resolved from the Linode API, or the LKE_NODE_IP
  # repo/environment variable when set) and Prometheus re-reads it without a
  # restart. An empty target list means the IP could not be resolved, and
  # LkeGeneratorsDown fires instead of silently showing nothing.
  #
  # Network path: terraform/lke.tf `allow-chain-exporter-nodeport` (inbound to
  # the LKE node, from the VPS IP only) + terraform/main.tf
  # `allow-lke-exporter-out` (VPS egress to the LKE node IPs only), both derived
  # from live resources in tofu, no IP literals.
  - job_name: lke-chain
    scrape_interval: 30s
    scrape_timeout: 15s
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/lke-chain.json
        refresh_interval: 5m
    relabel_configs:
      - target_label: network
        replacement: testnet

  # Self-monitoring (AUD-049): without these, TargetDown and AlertmanagerNotificationsFailing
  # have nothing to evaluate. Both listen on localhost only (compose/prometheus.yml).
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9091']
    relabel_configs:
      - target_label: network
        replacement: testnet

  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # Grafana's own /metrics (ECO-63). Served on loopback only; Caddy refuses /metrics on the public
  # Grafana host (scripts/render-caddyfile.sh). Feeds TargetDown.
  - job_name: grafana
    static_configs:
      - targets: ['127.0.0.1:3002']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # Caddy's metrics handler on a loopback-only site (scripts/render-caddyfile.sh, 127.0.0.1:2020).
  # Caddy's admin API is a unix socket, so it cannot be scraped directly. Feeds TargetDown.
  - job_name: caddy
    static_configs:
      - targets: ['127.0.0.1:2020']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # blackbox_exporter itself (compose/prometheus.yml). If it is down every probe below goes silent,
  # so TargetDown covers it.
  - job_name: blackbox
    static_configs:
      - targets: ['127.0.0.1:9115']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # Public endpoint probes (ECO-63), multi-target pattern: each target is "<module>@<url>", the
  # module part selects the check in monitoring/blackbox.yml. probe_success feeds EndpointProbeFailed.
  - job_name: blackbox-http
    metrics_path: /probe
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets:
          - 'http_matcher_settings@https://testnet-matcher.decentralchain.io/matcher/settings'
          - 'http_data_service_list@https://testnet-data-service.decentralchain.io/v0/transactions/transfer?limit=1'
          - 'http_2xx@https://testnet-ws.decentralchain.io/health'
        labels:
          network: testnet
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^@]+)@.+'
        target_label: __param_module
      - source_labels: [__address__]
        regex: '[^@]+@(.+)'
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_module]
        target_label: module
      - source_labels: [__param_target]
        regex: 'https://testnet-matcher\..*'
        target_label: service
        replacement: matcher
      - source_labels: [__param_target]
        regex: 'https://testnet-data-service\..*'
        target_label: service
        replacement: data-service
      - source_labels: [__param_target]
        regex: 'https://testnet-ws\..*'
        target_label: service
        replacement: websocket
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-websocket
    metrics_path: /probe
    scrape_interval: 60s
    scrape_timeout: 15s
    params:
      module: [tcp_websocket_upgrade_testnet_ws]
    static_configs:
      - targets: ['testnet-ws.decentralchain.io:443']
        labels:
          network: testnet
          service: websocket
          module: tcp_websocket_upgrade_testnet_ws
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
