global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    network: testnet

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
      timeout: 10s

scrape_configs:
  - job_name: dcc-chain
    static_configs:
      - targets: ['127.0.0.1:9101']
    relabel_configs:
      - target_label: network
        replacement: testnet
  # BPS now exposes bps_up / bps_last_synced_height at :9090/metrics
  # (blockchain-postgres-sync/src/bin/consumer.rs).
  - job_name: bps
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9090']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # Loki metrics — ingestion rate, chunk/index store ops, compaction lag.
  # Loki exposes Prometheus-format metrics at :3100/metrics.
  - job_name: loki
    static_configs:
      - targets: ['127.0.0.1:3100']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # Alloy metrics (Promtail's successor — see compose/loki.yml). Metric names
  # differ from Promtail's own (grafana/alloy's convert tool flagged this) —
  # no existing alert rule references promtail-specific metrics, so nothing
  # else needed updating.
  - job_name: alloy
    static_configs:
      - targets: ['127.0.0.1:12345']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # redis_exporter — connected_clients, keyspace hit ratio, memory, persistence
  # (rdb_last_save/aof_last_write_status), evicted_keys. See compose/redis.yml.
  - job_name: redis
    static_configs:
      - targets: ['127.0.0.1:9121']
    relabel_configs:
      - target_label: network
        replacement: testnet

  # ── Cross-site federation: LKE in-cluster Prometheus (Task 13) ─────────────
  # Pulls the LKE cluster's chain metrics-exporter series (dcc_block_height /
  # dcc_blockchain_height_age_seconds per node — gen-0/gen-1/val-0, see
  # clusters/testnet/monitoring/metrics-exporter.yaml) and a handful of
  # kube-state/cAdvisor series already referenced by the in-cluster
  # PrometheusRule (clusters/testnet/monitoring/kube-prometheus-stack.yaml's
  # DCCPodRestarting/DCCDiskPressure/DCCContainerMemoryPressure alerts) into
  # this Prometheus, so on-call sees per-node/gen-vs-val chain health and pod
  # health in the SAME Grafana (grafana.testnet.decentralchain.io) they
  # already watch, instead of needing a second, in-cluster Grafana.
  #
  # T2 lag (dcc_hotstuff_lag) and T0 lag (dcc_finality_lag) are NOT federated
  # here — they're already scraped locally by the `dcc-chain` job above via
  # exporter.py hitting the public node REST API, so no federation was needed
  # for those two. What federation adds is the per-node (gen-0/gen-1/val-0)
  # granularity that only the in-cluster exporter has.
  #
  # DEPLOY-TIME ACTION REQUIRED: this job only works once (1) the LKE-side
  # kube-prometheus-stack.yaml prometheus.service NodePort change has been
  # reconciled by Flux, and (2) the matching Linode firewall rule
  # (terraform/lke.tf's allow-prometheus-federate-nodeport, gated on
  # var.lke_federate_allowed_ips) has been terraform-applied. Until both are
  # done, this target will show as `down` in Newark's Prometheus — that is
  # expected in the interim, not a config bug. An operator must verify
  # reachability at deploy time, e.g.:
  #   curl -sf 'http://172.105.64.89:32090/federate?match[]={__name__=~"dcc_.*"}'
  - job_name: federate-lke
    scrape_interval: 30s
    scrape_timeout: 15s
    honor_labels: true
    metrics_path: /federate
    scheme: http
    params:
      'match[]':
        - '{__name__=~"dcc_.*"}'
        - '{__name__=~"kube_pod_container_status_restarts_total|kubelet_volume_stats_used_bytes|kubelet_volume_stats_capacity_bytes|container_memory_working_set_bytes|container_spec_memory_limit_bytes"}'
    static_configs:
      - targets: ['172.105.64.89:32090']
    relabel_configs:
      - target_label: network
        replacement: testnet
      - target_label: source
        replacement: lke-incluster
