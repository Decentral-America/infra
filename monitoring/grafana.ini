[server]
# Loopback only: Caddy proxies 127.0.0.1:3002; the healthcheck uses 127.0.0.1 too.
http_addr = 127.0.0.1
http_port = 3002
domain = grafana.testnet.decentralchain.io
root_url = https://grafana.testnet.decentralchain.io

[security]
allow_embedding = true
# Never leave the admin password at the default "admin". Even with the login form
# disabled below, set a strong one via env (GF_SECURITY_ADMIN_PASSWORD) as defense
# in depth so grafana-cli / API basic-auth can't be brute-forced to admin/admin.

[auth]
# Anonymous access is OFF (mainnet bar A7). The admin dashboard embeds ONE public (shared)
# dashboard, /public-dashboards/<token> (created idempotently by monitoring/scripts/deploy-monitoring.sh);
# public dashboards need no login and expose only that dashboard's panel queries.
# Disable the interactive login form and basic auth entirely so the default
# admin/admin credentials cannot be used to take over the instance (add a
# datasource -> SSRF). Dashboards + datasources are file-provisioned, so no web
# admin login is needed; use grafana-cli on the host for any admin change.
disable_login_form = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[users]
default_theme = dark

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/testnet.json

[plugins]
# Grafana 13's background preinstaller "updates" the bundled datasource plugins at startup. It first
# unregisters each one, then fails to replace it under the read-only root filesystem
# (unlinkat /usr/share/grafana/data/plugins-bundled/prometheus: read-only file system), leaving
# Prometheus and Loki "Plugin not registered" and every dashboard empty (grafana/grafana#132528).
# Keep the plugins shipped in the pinned image; plugin updates arrive with image bumps instead.
preinstall_auto_update = false

[analytics]
reporting_enabled = false
check_for_updates = false
