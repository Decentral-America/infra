# Loki is NOT exposed through Grafana. grafana.testnet is public with anonymous Viewer access
# (embedded in the admin dashboard), and Grafana OSS has no per-datasource permissions, so any
# provisioned Loki datasource let anyone on the internet run log queries -- including over access
# logs that carried API keys (2026-10-18 audit). No dashboard uses Loki. Operators query logs on
# the VPS instead:  ssh ... 'docker exec loki-testnet wget -qO- "http://127.0.0.1:3100/loki/api/v1/query_range?query=..."'
apiVersion: 1
deleteDatasources:
  - name: Loki
    orgId: 1
