groups:
  - name: dcc-testnet-critical
    interval: 60s
    rules:
      # ── Chain liveness — dcc_blockchain_height_age_seconds is seconds since last block ──
      - alert: BlockProductionStalled
        expr: |
          dcc_blockchain_height_age_seconds > 300
        for: 5m
        labels:
          severity: critical
          network: testnet
        annotations:
          summary: "DCC testnet block production stalled (>5 min since last block)"
          description: "dcc_blockchain_height_age_seconds > 300. Chain may be halted or main node offline."

      # ── Finality (feature-25 Deterministic Finality — the authoritative finalized height) ──
      # This is the authoritative finalized height from GET /blocks/height/finalized. If generators
      # stop committing or quorum is lost, the lag grows and this fires (covers the old generator-count
      # alerts). On this testnet HotStuff is authoritative (hotstuff.authoritative = true): its commits
      # raise the finalized height, and normal lag is ~3 blocks. When HotStuff stalls, finality falls
      # back to height - max-rollback (100), so the lag is CAPPED near 100 and never grows past it: the
      # old `lag > 250` could never fire, and the 30-minute stalls of 2026-10-04 paged nobody. Lag > 20
      # for 10 min means HotStuff stopped committing (empty-committee periods also show lag ~100).
      - alert: FinalizationStalled
        expr: |
          dcc_finality_lag > 20
        for: 10m
        labels:
          severity: high
          network: testnet
        annotations:
          summary: "DCC finality lagging >20 blocks for 10 min (normal ~3)"
          description: "dcc_finality_lag > 20 for 10 min; normal is ~3 with HotStuff committing. Check the committee (GET /generators/at/<period start>), the generators' logs for 'Self-commit ... rejected' and '[HotStuff] WATCHDOG', and that main has its 3 LKE peers."

      # ── Exporter health ────────────────────────────────────────────────────
      - alert: ExporterScrapeError
        expr: |
          dcc_scrape_error == 1
        for: 5m
        labels:
          severity: high
          network: testnet
        annotations:
          summary: "DCC exporter cannot reach node endpoints"
          description: "dcc_scrape_error=1 for 5 min. Node REST API may be unreachable."

      # ── Committee gap early warning (root cause of testnet committee-gap incidents) ──
      # dcc_generation_period_pct_elapsed and dcc_next_period_committee_size are emitted
      # by exporter.py from /node/status (generationPeriodLength) and
      # GET /generators/at/{nextPeriodStart} respectively. The committee-size metric is
      # -1 when the endpoint returned a non-200 status (e.g. 404 out-of-range) -- that is
      # NOT the same as a genuine empty committee, so the alert must match `== 0` exactly,
      # never `<= 0` or "not > 0", to avoid the exact naive-jq-length bug this whole task
      # exists to fix (CommonGeneratorsApi returns HTTP 404 with body "[]" out of range).
      # Generators commit in-process (self-commit-to-generation; the external commit workflows were
      # retired in 849148d). Fires BEFORE the period runs out empty.
      - alert: CommitteeGapUpcoming
        expr: |
          (dcc_generation_period_pct_elapsed > 60) and (dcc_next_period_committee_size == 0)
        for: 5m
        labels:
          severity: critical
          network: testnet
        annotations:
          summary: "DCC next generation period's committee is EMPTY with current period >60% elapsed on {{ $labels.node }}"
          description: "dcc_generation_period_pct_elapsed > 60 and dcc_next_period_committee_size == 0 for 5 min. The upcoming generation period has no committed generators -- committee is about to go empty. Check each generator's logs for 'Self-commit' lines (rejected / re-broadcast) and that its commit tx reached peers; a node can also commit via POST /transactions/broadcast of a CommitToGeneration tx."

      # A generator that was in the current committee but has not committed for the next period by 80%
      # of the period will drop out. Earlier than CommitteeGapUpcoming (which waits for an EMPTY committee).
      - alert: CommitteeShrinking
        expr: |
          (dcc_next_period_committee_size < dcc_current_period_committee_size)
            and (dcc_next_period_committee_size >= 0)
            and (dcc_generation_period_pct_elapsed > 80)
        for: 5m
        labels:
          severity: high
          network: testnet
        annotations:
          summary: "Next committee smaller than current ({{ $value }} generators) with the period >80% elapsed"
          description: "A generator in the current committee has not committed for the next period. Check its logs for 'Self-commit' rejections/re-broadcasts and its peers; compare GET /generators/at/<current start> with /generators/at/<next start>."

  - name: dcc-testnet-infra
    interval: 60s
    rules:
      # ── Prometheus exporter reachability ─────────────────────────────────
      - alert: ExporterDown
        expr: |
          up{job="dcc-chain"} == 0
        for: 5m
        labels:
          severity: critical
          network: testnet
        annotations:
          summary: "DCC chain exporter unreachable"
          description: "Prometheus cannot scrape dcc-exporter at :9101. Exporter container may be down."

      # ── Finality not advancing at all ─────────────────────────────────────
      - alert: FinalizationNotAdvancing
        expr: |
          increase(dcc_finalized_height[30m]) == 0
        for: 30m
        labels:
          severity: high
          network: testnet
        annotations:
          summary: "finalizedHeight not advancing for 30 min"
          description: "dcc_finalized_height has been completely static for 30 min: even the height - max-rollback fallback stopped, so block production itself has stalled. Check BlockProductionStalled and the nodes."

      # ── T2 HotStuff commit (AUTHORITATIVE on this testnet: hotstuff.authoritative = true) ──────
      # dcc_hotstuff_finalized_height is emitted only when dcc.hotstuff.enabled AND the node has
      # committed >=1 HotStuff block (see exporter.py). When present it should track the tip at
      # tip-settled-depth. If it goes static while the chain keeps producing, HotStuff QC formation
      # has regressed. Healthy commits arrive every ~30 s, so 10 min of none is a real stall (the
      # 2026-10-04 stalls lasted 30 min; the old 30m window + 30m `for` could never catch them).
      - alert: HotStuffCommitNotAdvancing
        expr: |
          (increase(dcc_hotstuff_finalized_height[10m]) == 0) and (increase(dcc_block_height[10m]) > 0)
        for: 5m
        labels:
          severity: high
          network: testnet
        annotations:
          summary: "HotStuff commit static for 15 min while the chain advances"
          description: "dcc_hotstuff_finalized_height has not advanced for 15 min although blocks are produced. Check '[HotStuff] WATCHDOG' and 'QC rejected' in the node logs, the committee for the current period, and peer connectivity."

      # ── T2 HotStuff real equivocations (CRITICAL, unlike other observational T2 alerts) ──────
      # dcc_hotstuff_equivocations_total is emitted only when an equivocation is detected
      # (voter signed conflicting votes at the same view/phase). ANY nonzero value is unambiguous
      # evidence of either a Byzantine actor or a protocol-violating bug — not merely
      # observational. Severity is CRITICAL.
      - alert: HotStuffEquivocationDetected
        expr: |
          dcc_hotstuff_equivocations_total > 0
        for: 1m
        labels:
          severity: critical
          network: testnet
        annotations:
          summary: "HotStuff equivocation detected -- CRITICAL, unlike T2's other observational alerts"
          description: "dcc_hotstuff_equivocations_total > 0. A committee member signed conflicting votes at the same view/phase -- either a Byzantine actor or a protocol-violating bug. Check node logs for '[HotStuff] EQUIVOCATION DETECTED' and investigate the named voter index immediately."

      # ── User-facing service uptime (MON-1) ─────────────────────────────────
      # dcc_service_up is emitted by exporter.py for each hosted service (matcher,
      # data-service, explorer, websocket, grafana, admin, faucet). 0 = the service
      # failed to answer (connection error/timeout/5xx). Previously NONE of these had
      # any alert, so an outage of the DEX/explorer/faucet paged nobody.
      - alert: ServiceDown
        expr: |
          dcc_service_up == 0
        for: 5m
        labels:
          severity: high
          network: testnet
        annotations:
          summary: "DCC service {{ $labels.service }} is DOWN"
          description: "dcc_service_up{service=\"{{ $labels.service }}\"} has been 0 for 5 min (connection failure / timeout / 5xx). Check the service container and its Caddy route."

      # ── Infra-down rules the 2026-09-17 outage proved missing (TESTNET-FINAL-PLAN Task 5.1 Step 3) ──
      # The plan draft used up{job="node-scala"}, but no such scrape job exists. The main node is
      # observed only through the `dcc-chain` exporter (exporter.py, node="main-node", public
      # HTTPS REST), which emits dcc_block_height ONLY when GET /blocks/height succeeded. So
      # "the series is absent" means "main node REST unreachable". When the exporter itself is
      # down, ExporterDown fires and inhibits this. LIMITATION: this Prometheus runs ON the VPS,
      # so a whole-VPS outage (2026-09-17) cannot page from here. That case needs an off-box
      # probe (TESTNET-FINAL-PLAN Task 0.2, infra-liveness.yml).
      - alert: MainNodeUnreachable
        expr: |
          absent(dcc_block_height{job="dcc-chain", node="main-node"})
        for: 5m
        labels:
          severity: critical
          network: testnet
        annotations:
          summary: "main node REST unreachable for 5 min (no dcc_block_height from the dcc-chain exporter)"
          description: "exporter.py could not read /blocks/height from the main node for 5 min. Check node-scala-testnet on the VPS (docker ps, docker logs) and the Caddy route for testnet-node.decentralchain.io."

      # gen-0/gen-1/val-0 heights arrive ONLY through the lke-chain job: this Prometheus scrapes
      # the LKE metrics-exporter NodePort directly (no in-cluster Prometheus, no federation). The
      # exporter labels them node=gen-0|gen-1|val-0 and only emits a node's dcc_block_height when
      # that node's REST /blocks/height answered. count(count by (node)) is immune to duplicate
      # series. The `or absent(...)` arm covers zero nodes reporting, where count() returns
      # nothing at all.
      # NOTE: that arm also fires when the scrape path itself is down (up{job="lke-chain"} == 0:
      # LKE outage, NodePort/firewall not applied, or an empty file_sd target list because
      # deploy-monitoring-stack.yml could not resolve the LKE node IP). That is intended. Either
      # way this Prometheus is blind to the LKE generators.
      - alert: LkeGeneratorsDown
        expr: |
          (count(count by (node) (dcc_block_height{job="lke-chain", node=~"gen-0|gen-1|val-0"})) < 3)
          or absent(dcc_block_height{job="lke-chain", node=~"gen-0|gen-1|val-0"})
        for: 10m
        labels:
          severity: critical
          network: testnet
        annotations:
          summary: "fewer than 3 LKE nodes (gen-0/gen-1/val-0) report a block height for 10 min"
          description: "dcc_block_height from the LKE metrics-exporter (job lke-chain) covers fewer than 3 of gen-0/gen-1/val-0. If up{job=\"lke-chain\"} == 0 or the job has no target, the scrape path is down (LKE outage, firewall/NodePort 32092, or an unresolved LKE node IP in file_sd/lke-chain.json); otherwise check pods with cluster-diagnostics.yml."

  # ── Exchange-indexer Postgres + host disk (TESTNET-FINAL-PLAN Task 7.3 item 02) ──────────
  # Fed by node-exporter (job `node`) and postgres-exporter (job `postgres`) in
  # compose/prometheus.yml. Neither existed before, so these rules had no data to evaluate.
  - name: dcc-testnet-capacity
    interval: 5m
    rules:
      # BPS indexes every block into bps_testnet. THRESHOLD IS PROVISIONAL. 1 GiB/day is well
      # above what a ~30s-block testnet should write, but the real baseline was never measured.
      # Re-tune from delta(pg_database_size_bytes{datname="bps_testnet"}[1d]) after the 72h soak
      # (TESTNET-FINAL-PLAN Task 6.6).
      - alert: PostgresDatabaseGrowthHigh
        expr: |
          delta(pg_database_size_bytes{job="postgres", datname="bps_testnet"}[1d]) > 1073741824
        for: 30m
        labels:
          severity: warning
          network: testnet
        annotations:
          summary: "bps_testnet grew more than 1 GiB in the last 24h"
          description: "pg_database_size_bytes{datname=\"bps_testnet\"} grew {{ $value | humanize1024 }}B over 24h. Check BPS for re-indexing loops (repeated rollbacks or duplicate delivery) before the disk fills. See HostDiskSpaceLow."

      # Postgres, the node's RocksDB volume and docker all share the VPS root filesystem.
      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{job="node", fstype=~"ext4|xfs|btrfs"}
            / node_filesystem_size_bytes{job="node", fstype=~"ext4|xfs|btrfs"}) < 0.20
        for: 15m
        labels:
          severity: high
          network: testnet
        annotations:
          summary: "VPS filesystem {{ $labels.mountpoint }} below 20% free"
          description: "{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free. Largest consumers: Postgres (bps_testnet), node-state-testnet volume, docker logs/images. restart-services.yml already truncates >50MB container logs."

      # Without this, a dead exporter makes the two rules above evaluate to "no data", not an alert.
      - alert: CapacityExporterDown
        expr: |
          up{job=~"node|postgres"} == 0
        for: 10m
        labels:
          severity: high
          network: testnet
        annotations:
          summary: "{{ $labels.job }} exporter unreachable for 10 min"
          description: "Prometheus cannot scrape the {{ $labels.job }} exporter (compose/prometheus.yml). Disk/Postgres capacity alerts are blind until it is back. For postgres, check pg_hba/role dcc and PG* vars in /opt/dcc/secrets/testnet.env."
