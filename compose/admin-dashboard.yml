# docker-compose for DCC Node Dashboard
# Location on server: /opt/dcc/compose/admin-dashboard.yml
#
# Traffic path: Cloudflare Tunnel → localhost:3001 → this container
# No Caddy entry needed — the tunnel is the only ingress.
# ─────────────────────────────────────────────────────────────────────────────

services:
  admin-dashboard:
    image: "${IMAGE_TAG:?IMAGE_TAG must be set — deploy via CI or set IMAGE_TAG=<image>:<sha> explicitly}"
    container_name: "admin-dashboard-${NETWORK:-mainnet}"
    restart: unless-stopped
    # host network mode: same reasoning as scanner — SSR loader makes outbound
    # requests to the DCC node URL which may resolve to the host's own IP.
    # PORT=3001 (the image default) avoids conflict with scanner on 3000.
    network_mode: host
    # E2E/stress-test execution happens in GitHub Actions (dispatched by
    # api.e2e.stream.ts / api.load-test.stream.ts), not in this container —
    # no local test suite path or load-tester binary needs to live here.
    env_file:
      - /opt/dcc/secrets/admin-dashboard-${NETWORK:-mainnet}.env
    environment:
      # Grafana anonymous access is off; the Operations page embeds the public (shared) dashboard.
      # The page appends "/d/testnet?orgId=1&refresh=30s&kiosk" to this value, so the trailing
      # "_=" swallows that suffix into a harmless query param. The token must equal
      # PUBLIC_DASHBOARD_TOKEN in monitoring/scripts/deploy-monitoring.sh (not a secret).
      GRAFANA_URL: "https://grafana.${NETWORK:-mainnet}.decentralchain.io/public-dashboards/1255a802508eddc1e9e74080cf7b68c8?theme=dark&_="
      # Treasury "fund" refuses every nodeUrl in production unless its origin is listed
      # (api.treasury.fund.ts isAllowedNodeUrl). Comma-separated origins.
      ADMIN_DASHBOARD_ALLOWED_NODE_URLS: "https://${NETWORK:-mainnet}-node.decentralchain.io"
      # The image default (testnet-scanner.decentralchain.io) has no DNS record.
      ADMIN_DASHBOARD_SCANNER_URL: "https://${NETWORK:-mainnet}.decentralscan.com"
      # The admin image refuses to start in production without its own public URL (OAuth
      # callback and absolute links); it no longer bakes in a per-network default.
      ADMIN_DASHBOARD_URL: "https://${NETWORK:-mainnet}-admin.decentralchain.io"
      # Treasury fund/sweep/scan need a GitHub login on this comma-separated list; an empty list
      # denies everyone in production (apps/admin-dashboard treasuryAccess.ts).
      ADMIN_DASHBOARD_TREASURY_USERS: "${ADMIN_DASHBOARD_TREASURY_USERS:-jourlez}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
