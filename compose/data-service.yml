# docker-compose for DCC Data Service
# Location on server: /opt/dcc/compose/data-service.yml
#
# Deploy via: docker compose -p data-service-testnet -f data-service.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  data-service:
    image: "${IMAGE_TAG:?IMAGE_TAG must be set — deploy via CI or set IMAGE_TAG=<image>:<sha> explicitly}"
    container_name: "data-service-${NETWORK:-mainnet}"
    restart: unless-stopped
    # host network mode: data-service connects to localhost:5432 (PostgreSQL).
    # Without this, Docker bridge mode makes 'localhost' resolve to the container's
    # own loopback — PostgreSQL is unreachable, causing ECONNREFUSED on all DB queries.
    # Caddy (also host-network) still reaches data-service on localhost:8080.
    # The ports: section is removed — incompatible with host networking.
    network_mode: host
    # PG*, DEFAULT_MATCHER, RATE_PAIR_ACCEPTANCE_VOLUME_THRESHOLD, RATE_THRESHOLD_ASSET_ID
    # (scripts/render-service-env.sh). Do NOT add them under environment: — it overrides
    # env_file, so an unset shell var would silently clear the value.
    env_file:
      - /opt/dcc/secrets/data-service-${NETWORK:-mainnet}.env
    environment:
      NODE_ENV: production
      # PORT is a hardcoded infrastructure constant, safe to set here.
      # Caddy proxies 127.0.0.1:8080 with TLS on 443.
      PORT: "8080"
      # data-service defaults to PGSSLMODE=require. For on-server PostgreSQL
      # (127.0.0.1 loopback), SSL adds no security benefit and requires a
      # trusted cert. Disable it for all local deployments.
      PGSSLMODE: "disable"
      # Cap every query at 25s so an aborted HTTP request cannot hold a pool
      # connection indefinitely (loadConfig.ts reads PGSTATEMENTTIMEOUT, ms).
      PGSTATEMENTTIMEOUT: "25000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # ── Container security hardening ───────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read-only root filesystem. Hono/Node needs write access only for tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Fills the `pairs` table that /v0/pairs and /v0/matchers/{address}/pairs read. Without it the
  # table stayed empty and /v0/pairs returned [] (2026-10-18 audit). Same image and env file as
  # data-service (it needs only PG*). deploy-container.yml brings up every service in this file,
  # so a data-service deploy moves both to the same image.
  pairs-daemon:
    image: "${IMAGE_TAG:?IMAGE_TAG must be set — deploy via CI or set IMAGE_TAG=<image>:<sha> explicitly}"
    container_name: "data-service-pairs-${NETWORK:-mainnet}"
    restart: unless-stopped
    network_mode: host
    command: ["node", "dist/daemons/pairs/index.mjs"]
    env_file:
      - /opt/dcc/secrets/data-service-${NETWORK:-mainnet}.env
    environment:
      NODE_ENV: production
      PGSSLMODE: "disable"
      PGSTATEMENTTIMEOUT: "25000"
      # Rebuild the table every 60s (default 2.5s); a ~30s-block testnet needs no more.
      PAIRS_UPDATE_INTERVAL: "60000"
      PAIRS_UPDATE_TIMEOUT: "30000"
    healthcheck:
      # No HTTP server here, so the image's HEALTHCHECK (GET :3000/health) does not apply.
      # PID 1 is the node process: alive = healthy; a crash exits and restarts the container.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
