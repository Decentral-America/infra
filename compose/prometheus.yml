# docker-compose for Prometheus — Newark backend node
# Scrapes the DCC chain metrics exporter (which calls DCC REST API over HTTPS).
# Location on server: /opt/dcc/compose/prometheus.yml
#
# Start: NETWORK=testnet docker compose -f /opt/dcc/compose/prometheus.yml up -d
services:
  prometheus:
    # prom/prometheus:v3.13.0 — LTS release, security upgrade from v3.12.0
    # Patches: CVE-2026-44990 (sanitize-html XSS in UI), CVE-2025-4673 and
    # CVE-2023-45289 (credentials forwarded on cross-host redirect) via
    # prometheus/common v0.69.0 bump. No breaking changes affect this
    # deployment (SHA-256 pagination tokens and PromQL min()/max() rename
    # are internal/behind experimental flags not used here).
    # Bumped v3.13.0 -> v3.15.0 (2026-09-29, latest stable; note v3.13 was
    # never an LTS line — the current LTS is v3.5). 3.14/3.15 [CHANGE]s:
    # stats-param deprecation, Hetzner SD label drop, duration expressions on
    # by default, --log.level deprecated (still works; not passed here) — none
    # affect this config. Verified: `promtool check config` (incl. alerts.yml)
    # passes with the v3.15.0 image.
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: "prometheus-${NETWORK:-testnet}"
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - /opt/dcc/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/dcc/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      # file_sd targets written by deploy-monitoring-stack.yml (lke-chain.json:
      # the LKE worker's current public IP). A directory mount, so a rewritten
      # file is seen without recreating the container.
      - /opt/dcc/monitoring/file_sd:/etc/prometheus/file_sd:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=127.0.0.1:9091'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  exporter:
    image: python:3.14-slim@sha256:c3e521df8b2b498a7a682e7e18676771cb80c6b75b8699af886b2d554ce40151
    container_name: "exporter-${NETWORK:-testnet}"
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m
    volumes:
      - /opt/dcc/monitoring/exporter.py:/app/exporter.py:ro
    command: ["python3", "/app/exporter.py"]
    environment:
      EXPORTER_PORT: "9101"
      # Node URLs — public HTTPS endpoints, no outbound firewall changes needed
      NODE_URLS: "main-node=https://testnet-node.decentralchain.io"
    # Was `wget ... | head -1 || exit 1`: python:3.14-slim has no wget, and the
    # pipeline's status was head's, so this could never fail. TESTNET-FINAL-PLAN Task 2.6.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if b'dcc_' in urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=4).read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 16m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Host + Postgres exporters (TESTNET-FINAL-PLAN Task 7.3 item 02) ─────────
  # Before these, the VPS had NO disk or Postgres metrics at all, so an
  # "exchange-indexer Postgres growth / disk free" rule had nothing to evaluate.
  # Both are localhost-only (host network, 127.0.0.1 listen) and scraped by
  # monitoring/prometheus.yml jobs `node` and `postgres`.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: "node-exporter-${NETWORK:-testnet}"
    network_mode: host
    pid: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      # Upstream-documented docker setup: host root read-only, rslave so
      # mounts created after start are visible.
      - "/:/host:ro,rslave"
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=127.0.0.1:9100'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($$|/)'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics | grep -q '^node_filesystem_avail_bytes'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: "postgres-exporter-${NETWORK:-testnet}"
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # Connects to the system Postgres as the existing `dcc` role. The DSN has no
    # user/password on purpose: lib/pq falls back to PGHOST/PGPORT/PGUSER/
    # PGPASSWORD/PGDATABASE from env_file (written by bootstrap.sh + push-secrets.yml),
    # so no new secret is needed. Same env_file pattern as BPS/data-service.
    env_file:
      - /opt/dcc/secrets/${NETWORK:-testnet}.env
    environment:
      DATA_SOURCE_NAME: "sslmode=disable"
    command:
      - '--web.listen-address=127.0.0.1:9187'
      # wal collector needs pg_ls_waldir (superuser/pg_monitor); dcc has neither.
      - '--no-collector.wal'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9187/metrics | grep -q '^pg_up 1'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    # Bumped 0.27.0 -> 0.33.0 (2026-07-04): 0.27.0 was ~2 years / 6 minors
    # stale. alertmanager.yml already uses the modern `matchers:` list syntax
    # (not the deprecated match:/match_re: maps), so it's already compatible
    # with 0.33's UTF-8-by-default matcher parser — verified before bumping.
    # Bumped 0.33.0 -> 0.33.1 (2026-07-05): bugfix-only patch release
    # (webhook doc fix, silences snapshot/legacy-matchers fix). No config
    # changes required.
    # Bumped 0.33.1 -> 0.34.1 (2026-09-29): only [CHANGE] is the finer-grained
    # `reason` label on alertmanager_notifications_failed_total (not used by
    # any alert/dashboard here). `amtool check-config` passes on 0.34.1.
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: "alertmanager-${NETWORK:-testnet}"
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /opt/dcc/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--web.listen-address=127.0.0.1:9093'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  alert-webhook:
    image: python:3.14-slim@sha256:c3e521df8b2b498a7a682e7e18676771cb80c6b75b8699af886b2d554ce40151
    container_name: "alert-webhook-${NETWORK:-testnet}"
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m
    volumes:
      - /opt/dcc/monitoring/alert-webhook.py:/app/alert-webhook.py:ro
    command: ["python3", "/app/alert-webhook.py"]
    environment:
      GITHUB_REPO: "Decentral-America/infra"
      ALERT_WEBHOOK_PORT: "9099"
      # GITHUB_TOKEN injected via env_file (SOPS-managed)
    env_file:
      - /opt/dcc/secrets/${NETWORK:-mainnet}.env
    # Was `wget ... || exit 0`, which could never fail. It also could not have
    # worked: python:3.14-slim ships no wget, and the webhook served no
    # /healthz route (GET returned 501). Now it uses python3 (present in the
    # image) against the /healthz route in alert-webhook.py, which returns 503
    # when GITHUB_TOKEN is unset (alerts would be silently dropped).
    # TESTNET-FINAL-PLAN Task 2.6.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9099/healthz', timeout=4).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus-data:
    name: "prometheus-data-${NETWORK:-testnet}"
