# ── DecentralChain Scala Node (VPS main node) ─────────────────────────────────
#
# The ONE definition of the main node container. Started only by scripts/node-up.sh
# (update-node-image.yml / deploy-node-config.yml / restart-host-network.yml), which
# passes NODE_SCALA_IMAGE from node-config/<network>/vps-image.env (digest-pinned,
# rule D6). There is deliberately no tag-based variable: a tag-based deploy (e.g. an
# old deploy-container.yml caller) fails here instead of drifting the node.
#
# Host networking, as the live node has run since the relaunch: P2P 6868 must be
# reachable by the LKE peers, and Caddy/BPS/matcher reach REST 6869, BlockchainUpdates
# 6881 and DEX gRPC 6887 on 127.0.0.1.
#
# State: external volume node-state-<network> (survives container replacement).
# ──────────────────────────────────────────────────────────────────────────────

services:
  node-scala:
    image: "${NODE_SCALA_IMAGE:?NODE_SCALA_IMAGE must be set to a digest from node-config/<network>/vps-image.env -- deploy with update-node-image.yml}"
    container_name: "node-scala-${NETWORK:-mainnet}"
    restart: unless-stopped
    network_mode: host

    # Only DCC_WALLET_SEED and DCC_WALLET_PASSWORD (scripts/render-service-env.sh); the
    # entrypoint moves them into a 0600 temp config and unsets them.
    env_file:
      - /opt/dcc/secrets/node-scala-${NETWORK:-mainnet}.env

    # Constants only — never duplicate env_file keys here.
    environment:
      # Without this, DCC_NETWORK defaults to "mainnet" (Dockerfile ENV).
      DCC_NETWORK: "${NETWORK:-mainnet}"
      # JVM heap — 2g is sufficient for testnet.
      DCC_HEAP_SIZE: "2g"
      # The entrypoint passes -Ddcc.rest-api.bind-address=$DCC_REST_API_BIND.
      DCC_REST_API_BIND: "0.0.0.0"
      # `DCC_LOG_LEVEL=DEBUG docker compose up ...` for live debugging (compose forwards only
      # variables referenced here).
      DCC_LOG_LEVEL: "${DCC_LOG_LEVEL:-INFO}"

    volumes:
      - "node-state-${NETWORK:-mainnet}:/var/lib/dcc"
      # entrypoint.sh requires /etc/dcc/dcc.conf before it builds the combined config.
      - "/opt/dcc/config/node-${NETWORK:-mainnet}/dcc.conf:/etc/dcc/dcc.conf:ro"
      # Plugin jars (plugins/<network>/ in this repo), loaded ahead of the node's own classes.
      - "/opt/dcc/plugins/${NETWORK:-mainnet}:/usr/share/dcc/lib/plugins:ro"

    # Healthy = REST answers AND /blocks/height changed within the last 15 min (900s).
    # /node/version only proved the JVM was up: a node stuck on one height (the
    # height-2640 InvalidStateHash stall class) stayed "healthy". State lives in /tmp
    # (tmpfs), so a restart starts a fresh window. wget: the image has no curl. $$ is
    # compose's escape for a literal $. TESTNET-FINAL-PLAN Task 2.6.
    healthcheck:
      test: ["CMD-SHELL", 'H=$$(wget -qO- -T 5 http://127.0.0.1:6869/blocks/height | sed ''s/[^0-9]//g''); [ -n "$$H" ] || exit 1; N=$$(date +%s); P=$$(cat /tmp/.liveness_h 2>/dev/null); T=$$(cat /tmp/.liveness_t 2>/dev/null || echo "$$N"); if [ "$$H" != "$$P" ]; then echo "$$H" >/tmp/.liveness_h; echo "$$N" >/tmp/.liveness_t; exit 0; fi; [ $$((N-T)) -lt 900 ]']
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,exec
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  node-state-mainnet:
    external: true
    name: "node-state-mainnet"
  node-state-stagenet:
    external: true
    name: "node-state-stagenet"
  node-state-testnet:
    external: true
    name: "node-state-testnet"
